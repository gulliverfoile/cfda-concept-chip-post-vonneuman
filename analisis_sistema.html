<script>
"use strict";
/* ============================================================================
   0. TEST FRAMEWORK (mini, sin dependencias)
   ----------------------------------------------------------------------------
   DECISIÓN: Un framework de tests propio y minimalista porque:
   - No queremos dependencias externas (la herramienta debe ser un archivo).
   - Los tests son documentación ejecutable: explican la lógica esperada.
   - Se ejecutan bajo demanda, no en cada carga (evita fallos por entorno).
   ============================================================================ */
const Test = (function(){
  const suites = [];
  return {
    suite(name, fn){ suites.push({name, tests: [], fn}); fn(); },
    test(name, fn){ suites[suites.length-1].tests.push({name, fn}); },
    assert(cond, msg){ if(!cond) throw new Error("ASSERT: " + (msg || "falló")); },
    assertEquals(a, b, msg){
      if(a !== b) throw new Error(`ASSERT EQ: esperado ${b}, recibido ${a}. ${msg||""}`);
    },
    assertApprox(a, b, tol, msg){
      if(Math.abs(a-b) > tol) throw new Error(`ASSERT ~: ${a} no está cerca de ${b} (±${tol}). ${msg||""}`);
    },
    run(){
      const results = [];
      let totalPass = 0, totalFail = 0;
      suites.forEach(s => {
        const suiteResult = {name: s.name, tests: []};
        s.tests.forEach(t => {
          try { t.fn(); suiteResult.tests.push({name: t.name, pass: true}); totalPass++; }
          catch(e){ suiteResult.tests.push({name: t.name, pass: false, error: e.message}); totalFail++; }
        });
        results.push(suiteResult);
      });
      return {results, totalPass, totalFail};
    }
  };
})();

/* ============================================================================
   1. EVENT BUS
   ----------------------------------------------------------------------------
   DECISIÓN: En lugar de que los módulos se llamen entre sí, emiten y escuchan
   eventos. Esto desacopla:
   - La UI no sabe del VSM: solo emite "answer:set" y escucha "render:request".
   - El VSM no sabe de la UI: escucha "vsm:evaluate" y emite "vsm:updated".
   - Los tests pueden suscribirse a eventos sin tocar la UI.
   ============================================================================ */
const EventBus = (function(){
  const listeners = {};
  return {
    on(event, fn){
      if(!listeners[event]) listeners[event] = [];
      listeners[event].push(fn);
      return () => { listeners[event] = listeners[event].filter(f => f !== fn); };
    },
    emit(event, data){
      (listeners[event] || []).forEach(fn => {
        try { fn(data); } catch(e){ console.error("Error en listener de", event, e); }
      });
    },
    clear(){ Object.keys(listeners).forEach(k => delete listeners[k]); }
  };
})();

/* ============================================================================
   2. LAYERS DATA
   ----------------------------------------------------------------------------
   DECISIÓN: Los datos son datos, no lógica. Separar LAYERS del código permite

      {id:"jur_dilucion", label:"Dilución de responsabilidad", hint:"Dolo, desidia, multas como coste, persona jurídica como escudo."},

      {id:"mat_deuda", label:"Deuda como acelerador", hint:"Interés compuesto exige crecimiento exponencial."},

/* ============================================================================
   3. STATE MODULE
   ----------------------------------------------------------------------------
   DECISIÓN: El estado es un objeto plano serializable. Los módulos no mutan
   el estado directamente: emiten eventos que el State Module aplica y persiste.
   Así el estado es la única fuente de verdad.
   ============================================================================ */
const State = (function(){
  const KEY = "circuito_analisis_v2";
  let data = {
    active: "gen",
    answers: {},
    indicators: {}
  };

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(raw) data = Object.assign(data, JSON.parse(raw));
    } catch(e){ console.warn("No se pudo cargar estado", e); }
  }
  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      EventBus.emit("state:saved", {timestamp: Date.now()});
    } catch(e){ console.warn("No se pudo guardar estado", e); }
  }
  function get(){ return data; }
  function set(path, value){
    // path simple: "answers.gen_hito"
    const parts = path.split(".");
    let obj = data;
    for(let i=0; i<parts.length-1; i++) obj = obj[parts[i]];
    obj[parts[parts.length-1]] = value;
    save();
    EventBus.emit("state:changed", {path, value});
  }
  function reset(){
    data = {active:"gen", answers:{}, indicators:{}};
    save();
    EventBus.emit("state:reset");
  }
  function loadData(newData){
    data = Object.assign({active:"gen", answers:{}, indicators:{}}, newData);
    save();
    EventBus.emit("state:loaded");
  }

  // Suscripciones a eventos
  EventBus.on("answer:set", ({id, value}) => set(`answers.${id}`, value));
  EventBus.on("indicator:add", ({qid, value}) => {
    if(!data.indicators[qid]) data.indicators[qid] = [];
    data.indicators[qid].push(value);
    save();
    EventBus.emit("indicators:changed", {qid});
  });
  EventBus.on("indicator:remove", ({qid, idx}) => {
    if(data.indicators[qid]) data.indicators[qid].splice(idx, 1);
    save();
    EventBus.emit("indicators:changed", {qid});
  });
  EventBus.on("layer:activate", ({id}) => { data.active = id; save(); });

  return { load, save, get, set, reset, loadData };
})();

/* ============================================================================
   4. VSM MODULE (Beer + Ashby)
   ----------------------------------------------------------------------------
   DECISIÓN CENTRAL: El VSM no se pregunta, se INFIERE. El usuario no responde
   "¿está capturada la auditoría?". El sistema lo deduce de cuánto contenido
   hay en la Capa 3. El usuario puede sobrescribir, pero el default es la
   inferencia.

   POR QUÉ: Si preguntáramos directamente, el usuario podría responder "no"
   aunque sus propias respuestas dijeran lo contrario. La inferencia obliga a
   la coherencia entre lo que describes y el diagnóstico.

   LÓGICA DE S3* (invertida): Cuanto MÁS contenido hay en Captura del árbitro,
   MENOS independiente es la auditoría. Es la única capa donde más = peor.
   Esto formaliza la patología central del capitalismo tardío.

   LÓGICA DE VARIEDAD (Ashby): systemVariety = extracción + convergencia +
   subjetividad. envVariety = límites + resistencia. Si envVariety > systemVariety,
   hay déficit: el sistema no puede absorber la variedad del entorno.
   ============================================================================ */
const VSM = (function(){

  // Helper: densidad de contenido de una capa (0-1)
  function contentDensity(layerId, state){
    const layer = LAYERS.find(l => l.id === layerId);
    if(!layer) return 0;
    const answered = layer.questions.filter(q =>
      state.answers[q.id] && state.answers[q.id].trim().length > 0
    ).length;
    return layer.questions.length ? answered / layer.questions.length : 0;
  }

  // Evalúa los subsistemas VSM a partir del estado
  // DECISIÓN: función pura (state → diagnosis). Testeable sin UI.
  function evaluate(state){
    const c = (id) => contentDensity(id, state);

    // S1 · Operaciones: ¿el sistema extrae valor?
    // Ponderación: extracción (70%) + convergencia (30%). La convergencia
    // es cómo se organizan las operaciones, no la operación en sí.
    const S1 = Math.round((c("ext") * 0.7 + c("conv") * 0.3) * 100);

    // S2 · Coordinación: ¿produce sujetos y neutraliza disenso?
    // Subjetividad (60%) + narrativa (40%). La subjetividad es la base;
    // la narrativa es la capa comunicativa que la refuerza.
    const S2 = Math.round((c("sub") * 0.6 + c("nar") * 0.4) * 100);

    // S3 · Control: ¿hay marco normativo que ordena el presente?
    const S3 = Math.round(c("jur") * 100);

    // S3* · Auditoría: INVERTIDA. Cuanta más captura descrita, menos auditoría.
    // Si no hay nada en Capa 3, asumimos auditoría intacta (100).
    // Si hay captura total, auditoría capturada (0).
    const S3star = Math.round((1 - c("cap")) * 100);

    // S4 · Inteligencia: ¿el sistema monitorea su entorno?
    // Si la Capa 7 (límites) está desarrollada, el sistema "ve" el entorno.
    // Pero ver no es actuar: por eso S4 puede ser alto mientras S3 lo ignora.
    const S4 = Math.round(c("mat") * 100);

    // S5 · Política/Identidad: ¿tiene identidad y valores?
    // Genealogía (50%) + narrativa (50%). La identidad se forma en el origen
    // y se reproduce en la narrativa.
    const S5 = Math.round((c("gen") * 0.5 + c("nar") * 0.5) * 100);

    // Variedad de Ashby: sistema vs entorno
    const systemVariety = (c("ext") + c("conv") + c("sub")) / 3;
    const envVariety = (c("mat") + c("res")) / 2;
    const varietyBalance = systemVariety - envVariety; // -1 a +1

    // Algedonia: ¿está abierto el canal de emergencia?
    // Si la resistencia se describe como "contenida", el canal está cerrado.
    // Invertimos: mucha Capa 8 con "contención" = algedonia silenciada.
    const algedonia = Math.round((1 - c("res")) * 100);

    // Diagnóstico: patologías detectadas
    const pathologies = [];

    if(S3star < 40){
      pathologies.push({
        code: "AUDIT_CAPTURED",
        title: "Auditoría capturada (S3*)",
        desc: "El regulador ha sido capturado por el regulado. La función de verificación no verifica."
      });
    }
    if(S3 > S4 + 20){
      pathologies.push({
        code: "PRESENT_OVER_FUTURE",
        title: "Presente sobre futuro (S3 > S4)",
        desc: "El control del presente subordina la inteligencia del entorno. El sistema prioriza extraer hoy sobre sobrevivir mañana."
      });
    }
    if(S5 > 60 && c("res") < 0.3){
      pathologies.push({
        code: "IDENTITY_AS_LEGITIMATION",
        title: "Identidad como legitimación (S5 patológico)",
        desc: "La identidad del sistema no permite alternativas. No hay S5 emergente en la Capa 8."
      });
    }
    if(varietyBalance < -0.2){
      pathologies.push({
        code: "VARIETY_DEFICIT",
        title: "Déficit de variedad (Ashby)",
        desc: "El entorno tiene más variedad que el sistema. El sistema no puede absorber lo que ha externalizado."
      });
    }
    if(algedonia < 40){
      pathologies.push({
        code: "ALGEDONIA_SILENCED",
        title: "Algedonia silenciada",
        desc: "El canal de emergencia está cerrado. La resistencia existe pero no llega a S5."
      });
    }

    // Score de viabilidad (0-100)
    // DECISIÓN: ponderación basada en las condiciones de Beer:
    // - S3* independiente: 30% (la auditoría es la condición de posibilidad)
    // - Balance S3-S4: 20% (sin balance, el sistema no se corrige)
    // - Variedad: 25% (sin variedad, no hay viabilidad según Ashby)
    // - Algedonia: 25% (sin canal de emergencia, la crisis no se detecta)
    const varietyScore = Math.max(0, Math.min(100, 50 + varietyBalance * 50));
    const feedbackBalance = 100 - Math.abs(S3 - S4);

    const viabilityScore = Math.round(
      S3star * 0.30 +
      feedbackBalance * 0.20 +
      varietyScore * 0.25 +
      algedonia * 0.25
    );

    // Veredicto textual
    let verdict, verdictColor;
    if(viabilityScore >= 70){ verdict = "Viable (en sentido Beer)"; verdictColor = "#5dd39e"; }
    else if(viabilityScore >= 45){ verdict = "Viable con patologías"; verdictColor = "#f0c05e"; }
    else { verdict = "No viable (patologías críticas)"; verdictColor = "#f07a7a"; }

    return {
      S1, S2, S3, S3star, S4, S5,
      varietyBalance: Math.round(varietyBalance * 100) / 100,
      algedonia,
      pathologies,
      viabilityScore,
      verdict,
      verdictColor
    };
  }

  // Recalcula y emite evento
  function refresh(){
    const diagnosis = evaluate(State.get());
    EventBus.emit("vsm:updated", diagnosis);
    return diagnosis;
  }

  EventBus.on("vsm:evaluate", refresh);
  EventBus.on("state:changed", refresh);

  return { evaluate, refresh };
})();

/* ============================================================================
   5. FEEDBACK MODULE
   ----------------------------------------------------------------------------
   DECISIÓN: Reglas if-then heurísticas, no un sistema experto. La idea es
   recordar al usuario que las capas están conectadas. Cada regla se puede
   testear de forma aislada.
   ============================================================================ */
const Feedback = (function(){
  const RULES = [
    {layer:"jur", needs:"jur_ficciones", tip:"Has definido ficciones legales. Revisa <strong>Capa 3 (Captura)</strong>: esas ficciones son el suelo de la captura."},
    {layer:"ext", needs:"ext_temporal", tip:"Extracción temporal detectada. Conecta con <strong>Capa 7 (Límites)</strong>: el interés compuesto exige crecimiento exponencial."},
    {layer:"cap", needs:"cap_jud", tip:"Captura judicial descrita. Verifica en <strong>Capa 2 (Extracción)</strong> si el lawfare opera como extracción de tiempo."},
    {layer:"sub", needs:"sub_psico", tip:"Psicología pervertida descrita. Cruza con <strong>Capa 5 (Narrativa)</strong>: el doble lenguaje es su cara visible."},
    {layer:"conv", needs:"conv_cierre", tip:"Circuito cerrado detectado. Comprueba en <strong>Capa 8 (Resistencia)</strong> si la resistencia contenida gana casos sin cambiar el circuito."},
    {layer:"mat", needs:"mat_deuda", tip:"Límite material señalado. Conecta con <strong>Capa 0 (Genealogía)</strong>: la deuda como motor original."},
    {layer:"res", needs:"res_alt", tip:"Alternativas identificadas. Revisa <strong>Capa 4 (Subjetividad)</strong>: ¿las captura el sistema como estatus?"},
    {layer:"fal", needs:"fal_cond", tip:"Condiciones de falsación definidas. Esto distingue el marco de una teoría conspirativa."}
  ];

  function getFeedback(layerId, state){
    const tips = RULES
      .filter(r => r.layer === layerId && state.answers[r.needs] && state.answers[r.needs].trim())
      .map(r => r.tip);
    return tips.length ? "<strong>Retroalimentación:</strong><br>· " + tips.join("<br>· ") : "";
  }

  return { getFeedback, RULES };
})();

/* ============================================================================
   6. EXPORT MODULE
   ----------------------------------------------------------------------------
   DECISIÓN: El markdown incluye el diagnóstico VSM al final. El análisis no es
   solo lo que el usuario escribió, sino también la lectura sistémica que el
   VSM hace de esas respuestas.
   ============================================================================ */
const Export = (function(){
  function buildMarkdown(state){
    let md = `# Análisis sistémico · Circuito de 8 capas + VSM\n\n`;
    md += `_Generado el ${new Date().toLocaleString()}_\n\n---\n\n`;

    LAYERS.forEach(l => {
      const hasContent = l.questions.some(q => state.answers[q.id] && state.answers[q.id].trim());
      if(!hasContent && !(state.indicators[l.id] || []).length) return;
      md += `## ${l.name}\n\n${l.lead}\n\n`;
      l.questions.forEach(q => {
        const v = state.answers[q.id];
        if(v && v.trim()){
          md += `### ${q.label}\n\n${v.trim()}\n\n`;
        }
        const inds = state.indicators[q.id] || [];
        if(inds.length){
          md += `**Datos/Indicadores:**\n`;
          inds.forEach(i => md += `- ${i}\n`);
          md += `\n`;
        }
      });
    });

    // Diagnóstico VSM
    const d = VSM.evaluate(state);
    md += `---\n\n## Diagnóstico VSM (Beer + Ashby)\n\n`;
    md += `**Veredicto:** ${d.verdict} (${d.viabilityScore}/100)\n\n`;
    md += `| Subsistema | Valor | Descripción |\n|---|---|---|\n`;
    md += `| S1 Operaciones | ${d.S1} | Extracción + convergencia |\n`;
    md += `| S2 Coordinación | ${d.S2} | Subjetividad + narrativa |\n`;
    md += `| S3 Control | ${d.S3} | Fundamento jurídico |\n`;
    md += `| S3* Auditoría | ${d.S3star} | Independencia del regulador (invertido) |\n`;
    md += `| S4 Inteligencia | ${d.S4} | Monitoreo del entorno |\n`;
    md += `| S5 Política | ${d.S5} | Identidad del sistema |\n`;
    md += `| Variedad (Ashby) | ${d.varietyBalance} | Sistema vs entorno |\n`;
    md += `| Algedonia | ${d.algedonia} | Canal de emergencia |\n\n`;

    if(d.pathologies.length){
      md += `**Patologías detectadas:**\n\n`;
      d.pathologies.forEach(p => {
        md += `- **${p.title}** (${p.code}): ${p.desc}\n`;
      });
    } else {
      md += `_No se detectaron patologías críticas._\n`;
    }

    md += `\n---\n\n_Nota: este análisis es una interpretación basada en hechos verificables e inferencias razonables. El diagnóstico VSM es una lectura sistémica, no una verdad dogmática._\n`;
    return md;
  }
  return { buildMarkdown };
})();

/* ============================================================================
   7. UI MODULE
   ----------------------------------------------------------------------------
   DECISIÓN: La UI escucha eventos y re-renderiza. No muta el estado: emite
   eventos que el State Module aplica. Esto rompe el acoplamiento UI-Estado.
   ============================================================================ */
const UI = (function(){
  const els = {
    side: () => document.getElementById("side"),
    content: () => document.getElementById("content"),
    modal: () => document.getElementById("modal"),
    modalBox: () => document.getElementById("modalBox"),
    saveStatus: () => document.getElementById("saveStatus")
  };

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function renderSide(){
    const state = State.get();
    let html = `<h3>Capas</h3>`;
    LAYERS.forEach(l => {
      const answered = l.questions.filter(q => state.answers[q.id] && state.answers[q.id].trim()).length;
      const isVsm = false; // VSM se renderiza aparte
      html += `<div class="layer-btn ${state.active===l.id?'active':''}" data-layer="${l.id}">
        <span class="dot" style="background:${l.color}"></span>
        <span>${l.name}</span>
        <span class="count">${answered}/${l.questions.length}</span>
      </div>`;
    });
    // VSM como capa especial
    const d = VSM.evaluate(state);
    html += `<h3>Diagnóstico</h3>
      <div class="layer-btn ${state.active==='vsm'?'active':''}" data-layer="vsm">
        <span class="dot" style="background:#a78bfa"></span>
        <span>Viabilidad VSM</span>
        <span class="count" style="color:${d.verdictColor}">${d.viabilityScore}</span>
      </div>`;
    els.side().innerHTML = html;
  }

  function renderCircuit(){
    let html = `<div class="circuit-wrap"><div class="circuit">`;
    LAYERS.forEach((l, i) => {
      const cls = l.res ? "res" : (l.fal ? "fal" : "");
      const active = State.get().active === l.id ? "active" : "";
      html += `<div class="node ${cls} ${active}" data-layer="${l.id}">${l.name}</div>`;
      if(i < LAYERS.length - 1) html += `<span class="arrow">→</span>`;
    });
    html += `<span class="arrow">→</span><div class="node vsm ${State.get().active==='vsm'?'active':''}" data-layer="vsm">VSM</div>`;
    html += `</div><div style="text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px">
      Circuito con retroalimentación. VSM es el diagnóstico, no una capa más.
    </div></div>`;
    return html;
  }

  function renderLayer(layerId){
    const state = State.get();
    const l = LAYERS.find(x => x.id === layerId);
    if(!l) return "";

    let html = `<h2>${l.name}</h2><p class="lead">${l.lead}</p>`;
    html += renderCircuit();

    const fb = Feedback.getFeedback(l.id, state);
    if(fb) html += `<div class="feedback">${fb}</div>`;

    l.questions.forEach(q => {
      const val = state.answers[q.id] || "";
      const inds = state.indicators[q.id] || [];
      html += `<div class="q-block">
        <label for="${q.id}">${q.label}</label>
        <div class="hint">${q.hint}</div>
        <textarea id="${q.id}" data-qid="${q.id}" placeholder="Escribe aquí...">${esc(val)}</textarea>
        <div class="indicator-row">
          <input type="text" id="ind_${q.id}" placeholder="Añadir indicador/dato y pulsar Enter" data-ind-for="${q.id}">
          <button data-action="add-indicator" data-qid="${q.id}">+ Dato</button>
        </div>
        <div class="tags">`;
      inds.forEach((v, i) => {
        html += `<span class="tag" data-action="remove-indicator" data-qid="${q.id}" data-idx="${i}" title="Clic para eliminar">${esc(v)} ✕</span>`;
      });
      html += `</div></div>`;
    });
    return html;
  }

  function renderVSM(){
    const d = VSM.evaluate(State.get());
    let html = `<h2>Diagnóstico de viabilidad · VSM (Beer + Ashby)</h2>
      <p class="lead">El VSM no se pregunta: se infiere de las respuestas de las otras capas. El usuario puede revisar el diagnóstico, pero no puede forzarlo sin cambiar las respuestas.</p>`;

    html += `<div class="viability-score" style="background:${d.verdictColor}15;border:1px solid ${d.verdictColor}55">
      <div class="n" style="color:${d.verdictColor}">${d.viabilityScore}</div>
      <div class="t">${d.verdict}</div>
    </div>`;

    html += `<div class="vsm-panel"><h3 style="margin-top:0">Subsistemas VSM</h3>
      <div class="vsm-grid">`;
    const subs = [
      {k:"S1", n:d.S1, label:"Operaciones", desc:"Extracción + convergencia"},
      {k:"S2", n:d.S2, label:"Coordinación", desc:"Subjetividad + narrativa"},
      {k:"S3", n:d.S3, label:"Control", desc:"Fundamento jurídico"},
      {k:"S3*", n:d.S3star, label:"Auditoría", desc:"Independencia (invertido)"},
      {k:"S4", n:d.S4, label:"Inteligencia", desc:"Monitoreo del entorno"},
      {k:"S5", n:d.S5, label:"Política", desc:"Identidad del sistema"}
    ];
    subs.forEach(s => {
      const color = s.k === "S3*" ? (s.n < 40 ? "#f07a7a" : "#5dd39e") : "#6ea8fe";
      html += `<div class="vsm-card">
        <div class="label">${s.k} · ${s.label}</div>
        <div class="value" style="color:${color}">${s.n}</div>
        <div class="desc">${s.desc}</div>
        <div class="bar"><span style="width:${s.n}%;background:${color}"></span></div>
      </div>`;
    });
    html += `</div>`;

    html += `<h3>Indicadores transversales</h3>
      <div class="vsm-grid">
        <div class="vsm-card">
          <div class="label">Variedad (Ashby)</div>
          <div class="value" style="color:${d.varietyBalance < -0.2 ? "#f07a7a" : "#5dd39e"}">${d.varietyBalance > 0 ? "+" : ""}${d.varietyBalance}</div>
          <div class="desc">Sistema vs entorno. Negativo = déficit.</div>
        </div>
        <div class="vsm-card">
          <div class="label">Algedonia</div>
          <div class="value" style="color:${d.algedonia < 40 ? "#f07a7a" : "#5dd39e"}">${d.algedonia}</div>
          <div class="desc">Canal de emergencia abierto.</div>
        </div>
      </div></div>`;

    html += `<div class="vsm-panel"><h3 style="margin-top:0">Patologías detectadas</h3>`;
    if(d.pathologies.length === 0){
      html += `<div class="pathology ok"><strong>Sin patologías críticas.</strong> El sistema cumple las condiciones de viabilidad de Beer.</div>`;
    } else {
      d.pathologies.forEach(p => {
        html += `<div class="pathology">
          <strong>${p.title}</strong> <span style="color:var(--muted);font-size:11px">(${p.code})</span><br>
          <span style="color:var(--muted)">${p.desc}</span>
        </div>`;
      });
    }
    html += `</div>`;

    html += `<div class="feedback" style="background:#1a1a2a;border-color:#3a3a5a;color:#b0b0d0">
      <strong style="color:#a78bfa">Cómo se calcula:</strong> S1-S5 se infieren de la densidad de contenido de cada capa.
      S3* está invertido (más captura = menos auditoría). La variedad compara sistema vs entorno.
      El score final pondera: S3* (30%) + balance S3-S4 (20%) + variedad (25%) + algedonia (25%).
    </div>`;

    return html;
  }

  function render(){
    renderSide();
    const active = State.get().active;
    if(active === "vsm"){
      els.content().innerHTML = renderVSM();
    } else {
      els.content().innerHTML = renderLayer(active);
    }
  }

  function openModal(html){
    els.modalBox().innerHTML = html;
    els.modal().classList.add("open");
  }
  function closeModal(){ els.modal().classList.remove("open"); }

  // Delegación de eventos: un solo listener en document
  // DECISIÓN: en lugar de attach listener a cada botón, delegamos. Más robusto
  // cuando el DOM se re-renderiza constantemente.
  document.addEventListener("click", (e) => {
    const layerBtn = e.target.closest("[data-layer]");
    if(layerBtn){
      EventBus.emit("layer:activate", {id: layerBtn.dataset.layer});
      render();
      return;
    }
    const action = e.target.closest("[data-action]");
    if(!action) return;
    const a = action.dataset.action;

    if(a === "add-indicator"){
      const qid = action.dataset.qid;
      const input = document.getElementById("ind_" + qid);
      const v = input.value.trim();
      if(v){
        EventBus.emit("indicator:add", {qid, value: v});
        input.value = "";
        render();
      }
    }
    else if(a === "remove-indicator"){
      EventBus.emit("indicator:remove", {qid: action.dataset.qid, idx: parseInt(action.dataset.idx, 10)});
      render();
    }
    else if(a === "load-example"){ loadExample(); }
    else if(a === "reset"){ if(confirm("¿Vaciar todo el análisis?")){ State.reset(); render(); } }
    else if(a === "export"){ openModal(exportModal()); }
    else if(a === "analysis"){ openModal(analysisModal()); }
    else if(a === "tests"){ openModal(testsModal()); }
    else if(a === "close-modal"){ closeModal(); }
  });

  // Input de texto: emitir evento en cada cambio
  document.addEventListener("input", (e) => {
    const ta = e.target.closest("textarea[data-qid]");
    if(ta){
      EventBus.emit("answer:set", {id: ta.dataset.qid, value: ta.value});
      // Actualizar contador sin re-render (para no perder foco)
      const l = LAYERS.find(x => x.questions.some(q => q.id === ta.dataset.qid));
      if(l){
        const answered = l.questions.filter(q => State.get().answers[q.id] && State.get().answers[q.id].trim()).length;
        const btn = document.querySelector(`.layer-btn[data-layer="${l.id}"] .count`);
        if(btn) btn.textContent = `${answered}/${l.questions.length}`;
      }
    }
  });

  // Enter en input de indicadores
  document.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && e.target.matches("input[data-ind-for]")){
      e.preventDefault();
      const qid = e.target.dataset.indFor;
      const v = e.target.value.trim();
      if(v){
        EventBus.emit("indicator:add", {qid, value: v});
        e.target.value = "";
        render();
      }
    }
  });

  function exportModal(){
    const md = Export.buildMarkdown(State.get());
    window._md = md;
    return `<h3>Exportar análisis</h3>
      <p style="color:var(--muted);font-size:12.5px">Incluye el diagnóstico VSM al final.</p>
      <pre class="export">${esc(md)}</pre>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="primary" data-action="download-md">Descargar .md</button>
        <button data-action="copy-md">Copiar</button>
        <button data-action="close-modal">Cerrar</button>
      </div>`;
  }

  function analysisModal(){
    const state = State.get();
    const filled = LAYERS.map(l => ({
      l,
      answered: l.questions.filter(q => state.answers[q.id] && state.answers[q.id].trim()).length,
      total: l.questions.length
    }));
    const totalAns = filled.reduce((s, x) => s + x.answered, 0);
    const totalQ = filled.reduce((s, x) => s + x.total, 0);
    const d = VSM.evaluate(state);

    let html = `<h3>Análisis generado</h3>
      <p style="color:var(--muted);font-size:12.5px">Progreso: ${totalAns}/${totalQ} preguntas · VSM: ${d.viabilityScore}/100 (${d.verdict})</p>
      <div style="margin:16px 0">`;
    filled.forEach(x => {
      const pct = Math.round(x.answered / x.total * 100);
      const color = pct === 100 ? "var(--ok)" : (pct > 0 ? "var(--warn)" : "var(--muted)");
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12.5px">
        <span style="width:200px;color:${x.l.color}">${x.l.name}</span>
        <span style="flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
          <span style="display:block;height:100%;width:${pct}%;background:${color}"></span>
        </span>
        <span style="width:50px;text-align:right;color:var(--muted)">${pct}%</span>
      </div>`;
    });
    html += `</div>
      <h4>Conexiones detectadas</h4><ul style="font-size:12.5px;color:var(--muted)">`;
    const withContent = LAYERS.filter(l => l.questions.some(q => state.answers[q.id] && state.answers[q.id].trim())).map(l => l.id);
    const conex = [];
    if(withContent.includes("jur") && withContent.includes("cap")) conex.push("<strong>Jurídico → Captura:</strong> las ficciones legales son el suelo de la captura.");
    if(withContent.includes("ext") && withContent.includes("mat")) conex.push("<strong>Extracción → Límites:</strong> los mecanismos presionan sobre los límites materiales.");
    if(withContent.includes("sub") && withContent.includes("nar")) conex.push("<strong>Subjetividad → Narrativa:</strong> la producción de subjetividad se sostiene con la narrativa.");
    if(withContent.includes("conv") && withContent.includes("res")) conex.push("<strong>Convergencia → Resistencia:</strong> el circuito explica por qué la resistencia gana casos, no el sistema.");
    if(conex.length === 0) conex.push("Rellena más capas para detectar conexiones.");
    conex.forEach(c => html += `<li>${c}</li>`);
    html += `</ul>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="primary" data-action="export">Exportar Markdown</button>
        <button data-action="close-modal">Cerrar</button>
      </div>`;
    return html;
  }

  function testsModal(){
    const {results, totalPass, totalFail} = Test.run();
    let html = `<h3>Tests · ${totalPass} pasados, ${totalFail} fallados</h3>`;
    results.forEach(s => {
      html += `<h4 style="margin-top:16px">${s.name}</h4><ul style="list-style:none;padding-left:0;font-size:12.5px">`;
      s.tests.forEach(t => {
        const color = t.pass ? "var(--ok)" : "var(--danger)";
        const icon = t.pass ? "✓" : "✗";
        html += `<li style="padding:4px 0;color:${color}">${icon} ${t.name}`;
        if(!t.pass) html += `<br><span style="color:var(--muted);font-size:11.5px;padding-left:16px">${esc(t.error)}</span>`;
        html += `</li>`;
      });
      html += `</ul>`;
    });
    html += `<div style="margin-top:16px"><button data-action="close-modal">Cerrar</button></div>`;
    return html;
  }

  EventBus.on("state:saved", ({timestamp}) => {
    const s = els.saveStatus();
    if(s) s.textContent = "Guardado · " + new Date(timestamp).toLocaleTimeString();
  });

  return { render, openModal, closeModal, esc };
})();

document.addEventListener("click", (e) => {

  if(!a) return;
  if(a.dataset.action === "download-md"){
    const blob = new Blob([window._md], {type:"text/markdown"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "analisis_circuito.md"; link.click();
    URL.revokeObjectURL(url);
  }
  if(a.dataset.action === "copy-md"){
    navigator.clipboard.writeText(window._md).then(() => alert("Copiado."));
  }
});

Test.suite("VSM · Subsistemas", () => {

    const d = VSM.evaluate({answers:{}, indicators:{}});

    Test.assert(d.viabilityScore < 60, "Sistema vacío no puede ser plenamente viable");
  });

      cap_fin:"x", cap_puertas:"x", cap_lobby:"x"

Test.suite("EventBus", () => {
  Test.test("on/emit funciona", () => {
    let received = null;
    const off = EventBus.on("test:event", (d) => { received = d; });
    EventBus.emit("test:event", {x: 42});
    Test.assertEquals(received.x, 42);
    off();
    received = null;
    EventBus.emit("test:event", {x: 99});
    Test.assertEquals(received, null, "Después de off no debe recibir");
  });

  Test.test("Múltiples listeners", () => {
    let a = 0, b = 0;
    EventBus.on("test:multi", () => a++);
    EventBus.on("test:multi", () => b++);
    EventBus.emit("test:multi");
    Test.assertEquals(a, 1);
    Test.assertEquals(b, 1);
  });

  Test.test("Listener que falla no bloquea a los demás", () => {
    let reached = false;
    EventBus.on("test:fail", () => { throw new Error("fallo intencional"); });
    EventBus.on("test:fail", () => { reached = true; });
    EventBus.emit("test:fail");
    Test.assert(reached, "El segundo listener debe ejecutarse aunque el primero falle");
  });
});
