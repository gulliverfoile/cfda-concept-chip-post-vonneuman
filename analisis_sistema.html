<script>
"use strict";

/* ============================================================================
   0. TEST FRAMEWORK
   ============================================================================ */
const Test = (function(){
  const suites = [];
  return {
    suite(name, fn){ suites.push({name, tests: []}); fn(); },
    test(name, fn){ suites[suites.length-1].tests.push({name, fn}); },
    assert(cond, msg){ if(!cond) throw new Error("ASSERT: " + (msg || "falló")); },
    assertEquals(a, b, msg){
      if(a !== b) throw new Error(`ASSERT EQ: esperado ${b}, recibido ${a}. ${msg||""}`);
    },
    assertApprox(a, b, tol, msg){
      if(Math.abs(a-b) > tol) throw new Error(`ASSERT ~: ${a} no cerca de ${b} (±${tol})`);
    },
    assertNull(v, msg){ if(v !== null) throw new Error(`ASSERT NULL: ${v} no es null. ${msg||""}`); },
    assertNotNull(v, msg){ if(v === null) throw new Error(`ASSERT NOT NULL: es null. ${msg||""}`); },
    run(){
      const results = []; let pass = 0, fail = 0;
      suites.forEach(s => {
        const sr = {name: s.name, tests: []};
        s.tests.forEach(t => {
          try { t.fn(); sr.tests.push({name: t.name, pass: true}); pass++; }
          catch(e){ sr.tests.push({name: t.name, pass: false, error: e.message}); fail++; }
        });
        results.push(sr);
      });
      return {results, pass, fail};
    }
  };
})();

/* ============================================================================
   1. EVENT BUS
   ============================================================================ */
const EventBus = (function(){
  const listeners = {};
  return {
    on(event, fn){
      if(!listeners[event]) listeners[event] = [];
      listeners[event].push(fn);
      return () => { listeners[event] = listeners[event].filter(f => f !== fn); };
    },
    emit(event, data){
      (listeners[event] || []).forEach(fn => {
        try { fn(data); } catch(e){ console.error("Error en listener", event, e); }
      });
    }
  };
})();

/* ============================================================================
   2. CAPAS POR DEFECTO

    ]

const DEFAULT_VSM_MAP = {
  S1: ["ext", "conv"],
  S2: ["sub", "nar"],
  S3: ["jur"],
  S3star: ["cap"],
  S4: ["mat", "res"],
  S5: ["gen", "nar"]
};

const DEFAULT_WEIGHTS = {
  S3star: 0.30,
  balance: 0.20,
  variety: 0.25,
  algedonia: 0.25
};

/* ============================================================================
   3. STATE MODULE
   ============================================================================ */
const State = (function(){
  const KEY = "monitor_cibernetico_v4";
  let data = {
    active: "gen",
    answers: {},
    indicators: {},
    layers: JSON.parse(JSON.stringify(DEFAULT_LAYERS)),
    vsmMap: JSON.parse(JSON.stringify(DEFAULT_VSM_MAP)),
    weights: Object.assign({}, DEFAULT_WEIGHTS)
  };

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        data = Object.assign(data, parsed);
        if(!data.layers || !data.layers.length) data.layers = JSON.parse(JSON.stringify(DEFAULT_LAYERS));
        if(!data.vsmMap) data.vsmMap = JSON.parse(JSON.stringify(DEFAULT_VSM_MAP));
        if(!data.weights) data.weights = Object.assign({}, DEFAULT_WEIGHTS);
      }
    } catch(e){ console.warn("No se pudo cargar estado", e); }
  }
  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      EventBus.emit("state:saved", {timestamp: Date.now()});
    } catch(e){ console.warn("No se pudo guardar", e); }
  }
  function get(){ return data; }
  function reset(){
    data = {
      active: "gen",
      answers: {}, indicators: {},
      layers: JSON.parse(JSON.stringify(DEFAULT_LAYERS)),
      vsmMap: JSON.parse(JSON.stringify(DEFAULT_VSM_MAP)),
      weights: Object.assign({}, DEFAULT_WEIGHTS)
    };
    save();
    EventBus.emit("state:reset");
  }
  function loadData(newData){
    data = Object.assign(data, newData);
    save();
    EventBus.emit("state:loaded");
  }

  EventBus.on("answer:set", ({id, value}) => {
    data.answers[id] = value;
    save();
    EventBus.emit("state:changed", {path: "answers." + id});
  });
  EventBus.on("indicator:add", ({qid, value}) => {
    if(!data.indicators[qid]) data.indicators[qid] = [];
    data.indicators[qid].push(value);
    save();
    EventBus.emit("indicators:changed", {qid});
  });
  EventBus.on("indicator:remove", ({qid, idx}) => {
    if(data.indicators[qid]) data.indicators[qid].splice(idx, 1);
    save();
    EventBus.emit("indicators:changed", {qid});
  });
  EventBus.on("layer:activate", ({id}) => {
    data.active = id;
    save();
    EventBus.emit("state:changed", {path: "active"});
  });
  EventBus.on("layers:update", ({layers, vsmMap, weights}) => {
    if(layers) data.layers = layers;
    if(vsmMap) data.vsmMap = vsmMap;
    if(weights) data.weights = weights;
    save();
    EventBus.emit("state:changed", {path: "layers"});
  });

  return { load, save, get, reset, loadData };
})();

/* ============================================================================
   4. VSM MODULE (Beer + Ashby) con factor de completitud
   ----------------------------------------------------------------------------
   DECISIÓN v4: El score se pondera por la completitud del análisis.
   Un sistema vacío NO es un sistema sano: es un sistema NO DIAGNOSTICADO.
   - Si completitud < 0.1 → verdict "Sin datos suficientes", score = null.
   - Si completitud >= 0.1 → score = base * (0.4 + 0.6 * completitud).
   Esto evita que la ausencia de datos se confunda con ausencia de patologías.
   ============================================================================ */
const VSM = (function(){

  function contentDensity(layerId, state){
    const layer = state.layers.find(l => l.id === layerId);
    if(!layer) return 0;
    const answered = layer.questions.filter(q =>
      state.answers[q.id] && state.answers[q.id].trim().length > 0
    ).length;
    return layer.questions.length ? answered / layer.questions.length : 0;
  }

  function avgDensity(layerIds, state){
    if(!layerIds || !layerIds.length) return 0;
    const sum = layerIds.reduce((s, id) => s + contentDensity(id, state), 0);
    return sum / layerIds.length;
  }

  function completeness(state){
    const total = state.layers.reduce((s, l) => s + l.questions.length, 0);
    if(!total) return 0;
    const answered = state.layers.reduce((s, l) =>
      s + l.questions.filter(q => state.answers[q.id] && state.answers[q.id].trim().length > 0).length
    , 0);
    return answered / total;
  }

  function evaluate(state){
    const map = state.vsmMap || DEFAULT_VSM_MAP;
    const w = state.weights || DEFAULT_WEIGHTS;

    const S1 = Math.round(avgDensity(map.S1, state) * 100);
    const S2 = Math.round(avgDensity(map.S2, state) * 100);
    const S3 = Math.round(avgDensity(map.S3, state) * 100);
    const S3star = Math.round((1 - avgDensity(map.S3star, state)) * 100);
    const S4 = Math.round(avgDensity(map.S4, state) * 100);
    const S5 = Math.round(avgDensity(map.S5, state) * 100);

    const systemVariety = (avgDensity(map.S1, state) + avgDensity(map.S2, state) + avgDensity(map.S3, state)) / 3;
    const envVariety = avgDensity(map.S4, state);
    const varietyBalance = Math.round((systemVariety - envVariety) * 100) / 100;

    const resLayer = (map.S4 && map.S4.length) ? map.S4[map.S4.length - 1] : null;
    const algedonia = resLayer
      ? Math.round((1 - contentDensity(resLayer, state)) * 100)
      : 50;

    const comp = completeness(state);

    // Patologías (solo si hay datos suficientes)
    const pathologies = [];
    if(comp >= 0.1){
      if(S3star < 40){
        pathologies.push({code:"AUDIT_CAPTURED", title:"Auditoría capturada (S3*)",
          desc:"El regulador ha sido capturado por el regulado. La verificación no verifica."});
      }
      if(S3 > S4 + 20){
        pathologies.push({code:"PRESENT_OVER_FUTURE", title:"Presente sobre futuro (S3 > S4)",
          desc:"El control del presente subordina la inteligencia del entorno."});
      }
      if(S5 > 60 && avgDensity(map.S4, state) < 0.3){
        pathologies.push({code:"IDENTITY_AS_LEGITIMATION", title:"Identidad como legitimación (S5)",
          desc:"La identidad del sistema no permite alternativas. No hay S5 emergente."});
      }
      if(varietyBalance < -0.2){
        pathologies.push({code:"VARIETY_DEFICIT", title:"Déficit de variedad (Ashby)",
          desc:"El entorno tiene más variedad que el sistema. No puede absorber lo externalizado."});
      }
      if(algedonia < 40){
        pathologies.push({code:"ALGEDONIA_SILENCED", title:"Algedonia silenciada",
          desc:"El canal de emergencia está cerrado. La resistencia no llega a S5."});
      }
    }

    // Score base
    const varietyScore = Math.max(0, Math.min(100, 50 + varietyBalance * 50));
    const feedbackBalance = 100 - Math.abs(S3 - S4);
    const baseScore = Math.round(
      S3star * w.S3star +
      feedbackBalance * w.balance +
      varietyScore * w.variety +
      algedonia * w.algedonia
    );

    // Sin datos suficientes: no diagnosticable
    if(comp < 0.1){
      return {
        S1, S2, S3, S3star, S4, S5,
        varietyBalance, algedonia,
        pathologies: [],
        viabilityScore: null,
        verdict: "Sin datos suficientes",
        verdictColor: "#8b93a7",
        completeness: comp,
        baseScore
      };
    }

    // Score ponderado por completitud
    const viabilityScore = Math.round(baseScore * (0.4 + 0.6 * comp));

    let verdict, verdictColor;
    if(viabilityScore >= 70){ verdict = "Viable (en sentido Beer)"; verdictColor = "#5dd39e"; }
    else if(viabilityScore >= 45){ verdict = "Viable con patologías"; verdictColor = "#f0c05e"; }
    else { verdict = "No viable (patologías críticas)"; verdictColor = "#f07a7a"; }

    return {
      S1, S2, S3, S3star, S4, S5,
      varietyBalance, algedonia,
      pathologies, viabilityScore, verdict, verdictColor,
      completeness: comp,
      baseScore
    };
  }

  function refresh(){
    const d = evaluate(State.get());
    EventBus.emit("vsm:updated", d);
    return d;
  }

  EventBus.on("vsm:evaluate", refresh);
  EventBus.on("state:changed", refresh);

  return { evaluate, refresh, completeness };
})();

/* ============================================================================
   5. FEEDBACK MODULE
   ============================================================================ */
const Feedback = (function(){
  const RULES = [
    {layer:"jur", needs:"jur_ficciones", tip:"Ficciones legales → revisa <strong>Capa 3 (Captura)</strong>: son el suelo de la captura."},
    {layer:"ext", needs:"ext_temporal", tip:"Extracción temporal → conecta con <strong>Capa 7 (Límites)</strong>: el interés compuesto exige crecimiento."},
    {layer:"cap", needs:"cap_jud", tip:"Captura judicial → verifica en <strong>Capa 2 (Extracción)</strong> si el lawfare extrae tiempo."},
    {layer:"sub", needs:"sub_psico", tip:"Psicología pervertida → cruza con <strong>Capa 5 (Narrativa)</strong>: el doble lenguaje."},
    {layer:"conv", needs:"conv_cierre", tip:"Circuito cerrado → comprueba en <strong>Capa 8 (Resistencia)</strong> si gana casos sin cambiar el sistema."},
    {layer:"mat", needs:"mat_deuda", tip:"Límite material → conecta con <strong>Capa 0 (Genealogía)</strong>: la deuda como motor original."},
    {layer:"res", needs:"res_alt", tip:"Alternativas → revisa <strong>Capa 4 (Subjetividad)</strong>: ¿las captura como estatus?"},
    {layer:"fal", needs:"fal_cond", tip:"Falsación definida → esto distingue el marco de una teoría conspirativa."}
  ];

  function getFeedback(layerId, state){
    const hasDefault = state.layers.some(l => l.id === "jur");
    if(!hasDefault) return "";
    const tips = RULES
      .filter(r => r.layer === layerId && state.answers[r.needs] && state.answers[r.needs].trim())
      .map(r => r.tip);
    return tips.length ? "<strong>Retroalimentación:</strong><br>· " + tips.join("<br>· ") : "";
  }

  return { getFeedback, RULES };
})();

/* ============================================================================

   ============================================================================ */
const Export = (function(){
  function buildMarkdown(state){
    let md = `# Análisis sistémico · Monitor Cibernético\n\n`;
    md += `_Generado el ${new Date().toLocaleString()}_\n\n---\n\n`;

    state.layers.forEach(l => {
      const hasContent = l.questions.some(q => state.answers[q.id] && state.answers[q.id].trim());
      const hasInd = l.questions.some(q => (state.indicators[q.id] || []).length);
      if(!hasContent && !hasInd) return;
      md += `## ${l.name}\n\n${l.lead}\n\n`;
      l.questions.forEach(q => {
        const v = state.answers[q.id];
        if(v && v.trim()) md += `### ${q.label}\n\n${v.trim()}\n\n`;
        const inds = state.indicators[q.id] || [];
        if(inds.length){
          md += `**Datos/Indicadores:**\n`;
          inds.forEach(i => md += `- ${i}\n`);
          md += `\n`;
        }
      });
    });

    const d = VSM.evaluate(state);
    md += `---\n\n## Diagnóstico VSM (Beer + Ashby)\n\n`;
    md += `**Completitud del análisis:** ${Math.round(d.completeness * 100)}%\n\n`;
    if(d.viabilityScore === null){
      md += `**Veredicto:** Sin datos suficientes (completitud < 10%)\n\n`;
    } else {
      md += `**Veredicto:** ${d.verdict} (${d.viabilityScore}/100, base ${d.baseScore})\n\n`;
    }
    md += `| Subsistema | Valor |\n|---|---|\n`;
    md += `| S1 Operaciones | ${d.S1} |\n`;
    md += `| S2 Coordinación | ${d.S2} |\n`;
    md += `| S3 Control | ${d.S3} |\n`;
    md += `| S3* Auditoría (invertido) | ${d.S3star} |\n`;
    md += `| S4 Inteligencia | ${d.S4} |\n`;
    md += `| S5 Política | ${d.S5} |\n`;
    md += `| Variedad (Ashby) | ${d.varietyBalance} |\n`;
    md += `| Algedonia | ${d.algedonia} |\n\n`;

    if(d.pathologies.length){
      md += `**Patologías detectadas:**\n\n`;
      d.pathologies.forEach(p => md += `- **${p.title}** (${p.code}): ${p.desc}\n`);
    } else if(d.viabilityScore !== null){
      md += `_No se detectaron patologías críticas._\n`;
    } else {
      md += `_No hay datos suficientes para diagnosticar patologías._\n`;
    }
    md += `\n---\n\n_Nota: el score se pondera por completitud. Un análisis con pocos datos no es un sistema sano: es un sistema no diagnosticado._\n`;
    return md;
  }
  return { buildMarkdown };
})();

const HELP_HTML = `
<h2>Manual del Monitor Cibernético v4</h2>
<p>Esta herramienta es un <strong>monitor cibernético genérico</strong>. Por defecto viene configurada para analizar el capitalismo tardío, pero puedes reemplazar las capas por cualquier otro sistema. El sistema detecta automáticamente el diagnóstico de viabilidad (VSM de Beer + Ley de Ashby) a partir de la descripción que tú hagas.</p>

<h3>Novedad v4: factor de completitud</h3>
<p>El score de viabilidad se pondera por la <strong>completitud del análisis</strong>. Un sistema vacío no es un sistema sano: es un sistema no diagnosticado. Por eso:</p>
<ul>
  <li>Si completitud &lt; 10%: veredicto "Sin datos suficientes", score = null.</li>
  <li>Si completitud ≥ 10%: score = base × (0.4 + 0.6 × completitud).</li>
</ul>
<p>Esto evita el error de confundir ausencia de datos con ausencia de patologías.</p>

<h3>¿Qué es?</h3>
<p>Un sistema de análisis con <strong>8 capas + resistencia + falsabilidad</strong>, más un diagnóstico de viabilidad basado en cibernética organizacional. Cada capa tiene preguntas guía. Tú escribes; el sistema estructura, detecta conexiones y calcula viabilidad.</p>

<h3>¿Cómo rellenar los apartados?</h3>
<div class="step">
  <strong>Paso 1 · Elige una capa</strong><br>
  Puedes empezar por donde quieras. Si analizas un caso concreto, empieza por la Capa 2 (Extracción) o la Capa 3 (Captura). Si quieres entender el origen, empieza por la Capa 0 (Genealogía).
</div>
<div class="step">
  <strong>Paso 2 · Responde las preguntas</strong><br>
  Cada pregunta tiene una pista que explica qué se busca. No hay respuestas correctas ni incorrectas. Escribe lo que sepas, lo que observes o lo que intuyas. Si no sabes algo, déjalo en blanco.
</div>
<div class="step">
  <strong>Paso 3 · Añade datos</strong><br>
  Debajo de cada pregunta hay un campo para <em>indicadores</em>. Añade cifras, casos, fuentes. Pulsa Enter o el botón "+ Dato".
</div>
<div class="step">
  <strong>Paso 4 · Sigue la retroalimentación</strong><br>
  Cuando rellenas una pregunta, el sistema te avisa de conexiones con otras capas.
</div>
<div class="step">
  <strong>Paso 5 · Revisa el VSM</strong><br>
  Ve a la pestaña "Viabilidad VSM". Verás el diagnóstico inferido: subsistemas, variedad, algedonia, patologías, score y completitud.
</div>
<div class="step">
  <strong>Paso 6 · Exporta</strong><br>
  Pulsa "Exportar MD" para obtener un archivo Markdown con todo el análisis, incluyendo el diagnóstico VSM y el nivel de completitud.
</div>

<h3>¿Qué significa cada capa?</h3>
<ul>
  <li><strong>Capa 0 · Genealogía</strong>: de dónde viene el sistema.</li>
  <li><strong>Capa 1 · Fundamento jurídico</strong>: qué arquitectura legal lo hace posible.</li>
  <li><strong>Capa 2 · Extracción</strong>: cómo extrae valor.</li>
  <li><strong>Capa 3 · Captura del árbitro</strong>: cómo neutraliza al regulador.</li>
  <li><strong>Capa 4 · Producción de subjetividad</strong>: cómo produce los sujetos que aceptan.</li>
  <li><strong>Capa 5 · Gestión narrativa</strong>: cómo neutraliza la resistencia.</li>
  <li><strong>Capa 6 · Convergencia institucional</strong>: cómo operan las instituciones sin coordinación.</li>
  <li><strong>Capa 7 · Límites materiales</strong>: qué límites físicos tiene.</li>
  <li><strong>Capa 8 · Resistencia y cambio</strong>: cómo se rompe el circuito.</li>
  <li><strong>Falsabilidad</strong>: qué condiciones refutarían el análisis.</li>
</ul>

<h3>¿Cómo funciona el VSM?</h3>
<ul>
  <li><strong>S1 Operaciones</strong>: extracción + convergencia.</li>
  <li><strong>S2 Coordinación</strong>: subjetividad + narrativa.</li>
  <li><strong>S3 Control</strong>: fundamento jurídico.</li>
  <li><strong>S3* Auditoría</strong>: captura del árbitro <em>invertida</em>.</li>
  <li><strong>S4 Inteligencia</strong>: límites materiales + resistencia.</li>
  <li><strong>S5 Política</strong>: genealogía + narrativa.</li>
</ul>
<p>La <strong>Ley de Ashby</strong> dice que solo la variedad absorbe variedad. Si el entorno tiene más variedad que el sistema, hay déficit.</p>
<p>La <strong>algedonia</strong> es el canal de emergencia. Si la resistencia está silenciada, el canal está cerrado.</p>

<h3>¿Qué patologías detecta?</h3>
<ul>
  <li><strong>Auditoría capturada</strong>: el regulador no verifica.</li>
  <li><strong>Presente sobre futuro</strong>: el control subordina la inteligencia.</li>
  <li><strong>Identidad como legitimación</strong>: no hay alternativas.</li>
  <li><strong>Déficit de variedad</strong>: el entorno supera al sistema.</li>
  <li><strong>Algedonia silenciada</strong>: la resistencia no llega a S5.</li>
</ul>
<p>Las patologías solo se detectan si la completitud ≥ 10%. Sin datos suficientes, no hay diagnóstico.</p>

<h3>¿Cómo adaptarlo a otro sistema?</h3>
<p>Usa el <strong>Editor</strong>. Puedes renombrar capas, ajustar el mapeo VSM y modificar los pesos del score.</p>

<h3>Atajos</h3>

  <li>Clic en una etiqueta de indicador: la elimina.</li>
  <li>Los datos se guardan solos mientras escribes.</li>
</ul>
`;

/* ============================================================================
   8. UI MODULE
   ============================================================================ */
const UI = (function(){
  const els = {
    side: () => document.getElementById("side"),
    content: () => document.getElementById("content"),
    modal: () => document.getElementById("modal"),
    modalBox: () => document.getElementById("modalBox"),
    saveStatus: () => document.getElementById("saveStatus")
  };

  function esc(s){
    return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function renderSide(){
    const state = State.get();
    let html = `<h3>Capas</h3>`;
    state.layers.forEach(l => {
      const answered = l.questions.filter(q => state.answers[q.id] && state.answers[q.id].trim()).length;
      html += `<div class="layer-btn ${state.active===l.id?'active':''}" data-layer="${l.id}">
        <span class="dot" style="background:${l.color}"></span>
        <span>${l.name}</span>
        <span class="count">${answered}/${l.questions.length}</span>
      </div>`;
    });
    const d = VSM.evaluate(state);
    const scoreDisplay = d.viabilityScore === null ? "—" : d.viabilityScore;
    html += `<h3>Diagnóstico</h3>
      <div class="layer-btn ${state.active==='vsm'?'active':''}" data-layer="vsm">
        <span class="dot" style="background:#a78bfa"></span>
        <span>Viabilidad VSM</span>
        <span class="count" style="color:${d.verdictColor}">${scoreDisplay}</span>
      </div>`;
    els.side().innerHTML = html;
  }

  function renderCircuit(){
    const state = State.get();
    let html = `<div class="circuit-wrap"><div class="circuit">`;
    state.layers.forEach((l, i) => {
      const cls = l.res ? "res" : (l.fal ? "fal" : "");
      const active = state.active === l.id ? "active" : "";
      html += `<div class="node ${cls} ${active}" data-layer="${l.id}">${l.name}</div>`;
      if(i < state.layers.length - 1) html += `<span class="arrow">→</span>`;
    });
    html += `<span class="arrow">→</span><div class="node vsm ${state.active==='vsm'?'active':''}" data-layer="vsm">VSM</div>`;
    html += `</div></div>`;
    return html;
  }

  function renderLayer(layerId){
    const state = State.get();
    const l = state.layers.find(x => x.id === layerId);
    if(!l) return "";

    let html = `<h2>${l.name}</h2><p class="lead">${l.lead}</p>`;
    html += renderCircuit();

    const fb = Feedback.getFeedback(l.id, state);
    if(fb) html += `<div class="feedback">${fb}</div>`;

    l.questions.forEach(q => {
      const val = state.answers[q.id] || "";
      const inds = state.indicators[q.id] || [];
      html += `<div class="q-block">
        <label for="${q.id}">${q.label}</label>
        <div class="hint">${q.hint}</div>
        <textarea id="${q.id}" data-qid="${q.id}" placeholder="Escribe aquí...">${esc(val)}</textarea>
        <div class="indicator-row">
          <input type="text" id="ind_${q.id}" placeholder="Añadir indicador/dato y pulsar Enter" data-ind-for="${q.id}">
          <button data-action="add-indicator" data-qid="${q.id}">+ Dato</button>
        </div>
        <div class="tags">`;
      inds.forEach((v, i) => {
        html += `<span class="tag" data-action="remove-indicator" data-qid="${q.id}" data-idx="${i}" title="Clic para eliminar">${esc(v)} ✕</span>`;
      });
      html += `</div></div>`;
    });
    return html;
  }

  function renderVSM(){
    const d = VSM.evaluate(State.get());
    const scoreDisplay = d.viabilityScore === null ? "—" : d.viabilityScore;
    let html = `<h2>Diagnóstico de viabilidad · VSM (Beer + Ashby)</h2>
      <p class="lead">El VSM no se pregunta: se infiere de las respuestas. El score se pondera por completitud: un sistema vacío no es sano, es no diagnosticado.</p>`;

    html += `<div class="viability-score" style="background:${d.verdictColor}15;border:1px solid ${d.verdictColor}55">
      <div class="n" style="color:${d.verdictColor}">${scoreDisplay}</div>
      <div class="t">${d.verdict}</div>
      <div class="sub">Completitud: ${Math.round(d.completeness * 100)}% · Score base: ${d.baseScore}</div>
    </div>`;

    html += `<div class="vsm-panel"><h3 style="margin-top:0">Subsistemas VSM</h3><div class="vsm-grid">`;
    const subs = [
      {k:"S1", n:d.S1, label:"Operaciones", desc:"Extracción + convergencia"},
      {k:"S2", n:d.S2, label:"Coordinación", desc:"Subjetividad + narrativa"},
      {k:"S3", n:d.S3, label:"Control", desc:"Fundamento jurídico"},
      {k:"S3*", n:d.S3star, label:"Auditoría", desc:"Independencia (invertido)"},
      {k:"S4", n:d.S4, label:"Inteligencia", desc:"Monitoreo del entorno"},
      {k:"S5", n:d.S5, label:"Política", desc:"Identidad del sistema"}
    ];
    subs.forEach(s => {
      const color = s.k === "S3*" ? (s.n < 40 ? "#f07a7a" : "#5dd39e") : "#6ea8fe";
      html += `<div class="vsm-card">
        <div class="label">${s.k} · ${s.label}</div>
        <div class="value" style="color:${color}">${s.n}</div>
        <div class="desc">${s.desc}</div>
        <div class="bar"><span style="width:${s.n}%;background:${color}"></span></div>
      </div>`;
    });
    html += `</div>`;

    html += `<h3>Indicadores transversales</h3><div class="vsm-grid">
      <div class="vsm-card">
        <div class="label">Variedad (Ashby)</div>
        <div class="value" style="color:${d.varietyBalance < -0.2 ? "#f07a7a" : "#5dd39e"}">${d.varietyBalance > 0 ? "+" : ""}${d.varietyBalance}</div>
        <div class="desc">Sistema vs entorno. Negativo = déficit.</div>
      </div>
      <div class="vsm-card">
        <div class="label">Algedonia</div>
        <div class="value" style="color:${d.algedonia < 40 ? "#f07a7a" : "#5dd39e"}">${d.algedonia}</div>
        <div class="desc">Canal de emergencia abierto.</div>
      </div>
      <div class="vsm-card">
        <div class="label">Completitud</div>
        <div class="value" style="color:${d.completeness < 0.1 ? "#8b93a7" : (d.completeness < 0.5 ? "#f0c05e" : "#5dd39e")}">${Math.round(d.completeness * 100)}%</div>
        <div class="desc">Cuánto del sistema está descrito.</div>
      </div>
    </div></div>`;

    html += `<div class="vsm-panel"><h3 style="margin-top:0">Patologías detectadas</h3>`;
    if(d.viabilityScore === null){
      html += `<div class="pathology info"><strong>Sin datos suficientes.</strong> La completitud del análisis es inferior al 10%. Rellena más preguntas para obtener un diagnóstico fiable.</div>`;
    } else if(d.pathologies.length === 0){
      html += `<div class="pathology ok"><strong>Sin patologías críticas.</strong> El sistema cumple las condiciones de viabilidad de Beer.</div>`;
    } else {
      d.pathologies.forEach(p => {
        html += `<div class="pathology">
          <strong>${p.title}</strong> <span style="color:var(--muted);font-size:11px">(${p.code})</span><br>
          <span style="color:var(--muted)">${p.desc}</span>
        </div>`;
      });
    }
    html += `</div>`;

    html += `<div class="feedback" style="background:#1a1a2a;border-color:#3a3a5a;color:#b0b0d0">
      <strong style="color:#a78bfa">Cómo se calcula:</strong> S1-S5 se infieren de la densidad de contenido de cada capa.
      S3* está invertido (más captura = menos auditoría). La variedad compara sistema vs entorno.
      El score final pondera: S3* + balance S3-S4 + variedad + algedonia, y multiplica por el factor de completitud.
    </div>`;

    return html;
  }

  function render(){
    renderSide();
    const active = State.get().active;
    if(active === "vsm"){
      els.content().innerHTML = renderVSM();
    } else {
      els.content().innerHTML = renderLayer(active);
    }
  }

  function openModal(html){
    els.modalBox().innerHTML = html;
    els.modal().classList.add("open");
  }
  function closeModal(){ els.modal().classList.remove("open"); }

  document.addEventListener("click", (e) => {
    const layerBtn = e.target.closest("[data-layer]");
    if(layerBtn){
      EventBus.emit("layer:activate", {id: layerBtn.dataset.layer});
      render();
      return;
    }
    const action = e.target.closest("[data-action]");
    if(!action) return;
    const a = action.dataset.action;

    if(a === "add-indicator"){
      const qid = action.dataset.qid;
      const input = document.getElementById("ind_" + qid);
      const v = input.value.trim();
      if(v){
        EventBus.emit("indicator:add", {qid, value: v});
        input.value = "";
        render();
      }
    }
    else if(a === "remove-indicator"){
      EventBus.emit("indicator:remove", {qid: action.dataset.qid, idx: parseInt(action.dataset.idx, 10)});
      render();
    }
    else if(a === "help"){ openModal(HELP_HTML + `<div style="margin-top:16px"><button data-action="close-modal">Cerrar</button></div>`); }
    else if(a === "editor"){ openModal(editorModal()); }
    else if(a === "load-example"){ loadExample(); }
    else if(a === "reset"){ if(confirm("¿Vaciar todo el análisis?")){ State.reset(); render(); } }
    else if(a === "export"){ openModal(exportModal()); }
    else if(a === "analysis"){ openModal(analysisModal()); }
    else if(a === "tests"){ openModal(testsModal()); }
    else if(a === "close-modal"){ closeModal(); }
  });

  document.addEventListener("input", (e) => {
    const ta = e.target.closest("textarea[data-qid]");
    if(ta){
      EventBus.emit("answer:set", {id: ta.dataset.qid, value: ta.value});
      const layer = State.get().layers.find(x => x.questions.some(q => q.id === ta.dataset.qid));
      if(layer){
        const answered = layer.questions.filter(q => State.get().answers[q.id] && State.get().answers[q.id].trim()).length;
        const btn = document.querySelector(`.layer-btn[data-layer="${layer.id}"] .count`);
        if(btn) btn.textContent = `${answered}/${layer.questions.length}`;
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && e.target.matches("input[data-ind-for]")){
      e.preventDefault();
      const qid = e.target.dataset.indFor;
      const v = e.target.value.trim();
      if(v){
        EventBus.emit("indicator:add", {qid, value: v});
        e.target.value = "";
        render();
      }
    }
  });

  function exportModal(){
    const md = Export.buildMarkdown(State.get());
    window._md = md;
    return `<h3>Exportar análisis</h3>
      <p style="color:var(--muted);font-size:12.5px">Incluye el diagnóstico VSM y la completitud.</p>
      <pre class="export">${esc(md)}</pre>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="primary" data-action="download-md">Descargar .md</button>
        <button data-action="copy-md">Copiar</button>
        <button data-action="close-modal">Cerrar</button>
      </div>`;
  }

  function analysisModal(){
    const state = State.get();
    const filled = state.layers.map(l => ({
      l,
      answered: l.questions.filter(q => state.answers[q.id] && state.answers[q.id].trim()).length,
      total: l.questions.length
    }));
    const totalAns = filled.reduce((s, x) => s + x.answered, 0);
    const totalQ = filled.reduce((s, x) => s + x.total, 0);
    const d = VSM.evaluate(state);
    const scoreDisplay = d.viabilityScore === null ? "—" : d.viabilityScore;

    let html = `<h3>Análisis generado</h3>
      <p style="color:var(--muted);font-size:12.5px">Progreso: ${totalAns}/${totalQ} preguntas · Completitud: ${Math.round(d.completeness * 100)}% · VSM: ${scoreDisplay}${d.viabilityScore !== null ? "/100" : ""} (${d.verdict})</p>
      <div style="margin:16px 0">`;
    filled.forEach(x => {
      const pct = Math.round(x.answered / x.total * 100);
      const color = pct === 100 ? "var(--ok)" : (pct > 0 ? "var(--warn)" : "var(--muted)");
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12.5px">
        <span style="width:200px;color:${x.l.color}">${x.l.name}</span>
        <span style="flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
          <span style="display:block;height:100%;width:${pct}%;background:${color}"></span>
        </span>
        <span style="width:50px;text-align:right;color:var(--muted)">${pct}%</span>
      </div>`;
    });
    html += `</div>`;

    // Conexiones
    html += `<h4>Conexiones detectadas</h4><ul style="font-size:12.5px;color:var(--muted)">`;
    const withContent = state.layers.filter(l => l.questions.some(q => state.answers[q.id] && state.answers[q.id].trim())).map(l => l.id);
    const conex = [];
    if(withContent.includes("jur") && withContent.includes("cap")) conex.push("<strong>Jurídico → Captura:</strong> las ficciones legales son el suelo de la captura.");
    if(withContent.includes("ext") && withContent.includes("mat")) conex.push("<strong>Extracción → Límites:</strong> los mecanismos presionan sobre los límites materiales.");
    if(withContent.includes("sub") && withContent.includes("nar")) conex.push("<strong>Subjetividad → Narrativa:</strong> la producción de subjetividad se sostiene con la narrativa.");
    if(withContent.includes("conv") && withContent.includes("res")) conex.push("<strong>Convergencia → Resistencia:</strong> el circuito explica por qué la resistencia gana casos, no el sistema.");
    if(conex.length === 0) conex.push("Rellena más capas para detectar conexiones.");
    conex.forEach(c => html += `<li>${c}</li>`);
    html += `</ul>`;

    // Aviso de completitud
    if(d.completeness < 0.3){
      html += `<div class="feedback" style="background:#2a2a1a;border-color:#5a5a2a;color:#d0d0a0">
        <strong style="color:#f0c05e">Aviso:</strong> La completitud es del ${Math.round(d.completeness * 100)}%. Los diagnósticos con poca información son poco fiables.
      </div>`;
    }

    html += `<div style="margin-top:16px;display:flex;gap:8px">
        <button class="primary" data-action="export">Exportar Markdown</button>
        <button data-action="close-modal">Cerrar</button>
      </div>`;
    return html;
  }

  function editorModal(){
    const state = State.get();
    let html = `<h3>Editor de capas</h3>
      <p style="color:var(--muted);font-size:12.5px">Modifica las capas, el mapeo VSM y los pesos. Los cambios se guardan en localStorage.</p>`;

    html += `<h4>Capas</h4>`;
    state.layers.forEach((l, i) => {
      html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
        <div class="editor-row">
          <input type="text" value="${esc(l.name)}" data-edit="layer-name" data-idx="${i}" placeholder="Nombre">
          <input type="text" value="${esc(l.lead)}" data-edit="layer-lead" data-idx="${i}" placeholder="Descripción">
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">
          Preguntas: ${l.questions.length} · ID: ${l.id}
        </div>
        <button class="ghost danger" data-action="delete-layer" data-idx="${i}" style="margin-top:6px;font-size:11px">Eliminar capa</button>
      </div>`;
    });
    html += `<button data-action="add-layer" class="ghost" style="font-size:11.5px">+ Añadir capa</button>`;

    html += `<h4 style="margin-top:18px">Mapeo VSM</h4>
      <p style="color:var(--muted);font-size:11.5px">Qué capas alimentan cada subsistema (ids separados por comas). S3* está invertido.</p>`;
    ["S1","S2","S3","S3star","S4","S5"].forEach(k => {
      const val = (state.vsmMap[k] || []).join(", ");
      html += `<div class="editor-row">
        <label style="font-size:12px;color:var(--muted)">${k}</label>
        <input type="text" value="${esc(val)}" data-edit="vsm-map" data-key="${k}" placeholder="ids separados por coma">
      </div>`;
    });

    html += `<h4 style="margin-top:18px">Pesos del score</h4>`;
    ["S3star","balance","variety","algedonia"].forEach(k => {
      html += `<div class="editor-row">
        <label style="font-size:12px;color:var(--muted)">${k}</label>
        <input type="text" value="${state.weights[k]}" data-edit="weight" data-key="${k}">
      </div>`;
    });

    html += `<div style="margin-top:16px;display:flex;gap:8px">
      <button class="primary" data-action="save-editor">Guardar cambios</button>
      <button data-action="close-modal">Cerrar sin guardar</button>
    </div>`;

    return html;
  }

  function testsModal(){
    const {results, pass, fail} = Test.run();
    let html = `<h3>Tests · ${pass} pasados, ${fail} fallados</h3>`;
    results.forEach(s => {
      html += `<h4 style="margin-top:14px">${s.name}</h4><ul style="list-style:none;padding-left:0;font-size:12px">`;
      s.tests.forEach(t => {
        const color = t.pass ? "var(--ok)" : "var(--danger)";
        const icon = t.pass ? "✓" : "✗";
        html += `<li style="padding:3px 0;color:${color}">${icon} ${t.name}`;
        if(!t.pass) html += `<br><span style="color:var(--muted);font-size:11px;padding-left:14px">${esc(t.error)}</span>`;
        html += `</li>`;
      });
      html += `</ul>`;
    });
    html += `<div style="margin-top:16px"><button data-action="close-modal">Cerrar</button></div>`;
    return html;
  }

  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-action]");
    if(!a) return;
    if(a.dataset.action === "download-md"){
      const blob = new Blob([window._md], {type:"text/markdown"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = "analisis_monitor.md"; link.click();
      URL.revokeObjectURL(url);
    }
    if(a.dataset.action === "copy-md"){
      navigator.clipboard.writeText(window._md).then(() => alert("Copiado."));
    }
    if(a.dataset.action === "save-editor"){
      const layers = JSON.parse(JSON.stringify(State.get().layers));
      const vsmMap = {};
      const weights = Object.assign({}, State.get().weights);
      document.querySelectorAll("[data-edit='layer-name']").forEach(inp => {
        layers[parseInt(inp.dataset.idx, 10)].name = inp.value;
      });
      document.querySelectorAll("[data-edit='layer-lead']").forEach(inp => {
        layers[parseInt(inp.dataset.idx, 10)].lead = inp.value;
      });
      document.querySelectorAll("[data-edit='vsm-map']").forEach(inp => {
        vsmMap[inp.dataset.key] = inp.value.split(",").map(s => s.trim()).filter(Boolean);
      });
      document.querySelectorAll("[data-edit='weight']").forEach(inp => {
        const v = parseFloat(inp.value);
        if(!isNaN(v)) weights[inp.dataset.key] = v;
      });
      EventBus.emit("layers:update", {layers, vsmMap, weights});
      closeModal();
      render();
    }
    if(a.dataset.action === "delete-layer"){
      if(!confirm("¿Eliminar esta capa?")) return;
      const layers = JSON.parse(JSON.stringify(State.get().layers));
      layers.splice(parseInt(a.dataset.idx, 10), 1);
      EventBus.emit("layers:update", {layers});
      closeModal();
      render();
    }
    if(a.dataset.action === "add-layer"){
      const layers = JSON.parse(JSON.stringify(State.get().layers));
      const newId = "custom_" + Date.now();
      layers.push({
        id: newId,
        name: "Nueva capa",
        color: "#a0a0d0",
        lead: "Describe esta capa...",
        questions: [
          {id: newId + "_q1", label: "Pregunta 1", hint: "Qué buscar"},
          {id: newId + "_q2", label: "Pregunta 2", hint: "Qué buscar"}
        ]
      });
      EventBus.emit("layers:update", {layers});
      closeModal();
      render();
    }
  });

  EventBus.on("state:saved", ({timestamp}) => {
    const s = els.saveStatus();
    if(s) s.textContent = "Guardado · " + new Date(timestamp).toLocaleTimeString();
  });
  EventBus.on("state:changed", () => render());
  EventBus.on("state:reset", () => render());
  EventBus.on("state:loaded", () => render());
  EventBus.on("indicators:changed", () => render());

  return { render, openModal, closeModal, esc };
})();

Test.suite("VSM · Subsistemas", () => {
  Test.test("Sistema vacío → S1..S5 = 0, S3* = 100", () => {
    const d = VSM.evaluate({answers:{}, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS});
    Test.assertEquals(d.S1, 0);
    Test.assertEquals(d.S3, 0);
    Test.assertEquals(d.S3star, 100);
  });

  Test.test("S3* invertido: más captura → menos auditoría", () => {
    const state = {answers:{
      cap_fin:"x", cap_puertas:"x", cap_lobby:"x",
      cap_jud:"x", cap_med:"x", cap_acad:"x"
    }, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assertEquals(d.S3star, 0);
  });

  Test.test("S3* parcial: 3/6 capturas → S3* = 50", () => {
    const state = {answers:{
      cap_fin:"x", cap_puertas:"x", cap_lobby:"x"
    }, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assertEquals(d.S3star, 50);
  });
});

Test.suite("VSM · Completitud (v4)", () => {
  Test.test("Sistema vacío → completeness = 0, score = null, verdict = 'Sin datos'", () => {
    const d = VSM.evaluate({answers:{}, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS});
    Test.assertEquals(d.completeness, 0);
    Test.assertNull(d.viabilityScore);
    Test.assertEquals(d.verdict, "Sin datos suficientes");
  });

  Test.test("Completitud muy baja (<10%) → score null", () => {
    // 2 respuestas de ~48 preguntas totales → ~4%
    const state = {answers:{
      gen_hito:"x", gen_narrativa:"x"
    }, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assert(d.completeness < 0.1);
    Test.assertNull(d.viabilityScore);
  });

  Test.test("Completitud media → score ponderado", () => {
    // Rellenar aproximadamente la mitad
    const state = {answers:{
      gen_hito:"x", gen_narrativa:"x", gen_olvido:"x", gen_manual:"x",
      jur_ficciones:"x", jur_invisibles:"x", jur_dilucion:"x", jur_formal:"x",
      ext_temporal:"x", ext_eco:"x", ext_comp:"x", ext_est:"x",
      cap_fin:"x", cap_puertas:"x",
      sub_eco:"x", sub_antro:"x",
      nar_eq:"x", nar_law:"x",
      conv_actores:"x",
      mat_termo:"x",
      res_cont:"x"
    }, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assert(d.completeness > 0.4);
    Test.assertNotNull(d.viabilityScore);
    Test.assert(d.viabilityScore <= d.baseScore, "Ponderado debe ser <= base");
  });

  Test.test("Completitud total → score = base (factor 1.0)", () => {
    const allAnswers = {};
    DEFAULT_LAYERS.forEach(l => l.questions.forEach(q => { allAnswers[q.id] = "x"; }));
    const state = {answers: allAnswers, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assertApprox(d.completeness, 1, 0.001);
    Test.assertEquals(d.viabilityScore, d.baseScore, "Con completitud 1.0, ponderado = base");
  });

  Test.test("Captura total + completitud total → no viable", () => {
    const allAnswers = {};
    DEFAULT_LAYERS.forEach(l => l.questions.forEach(q => { allAnswers[q.id] = "x"; }));
    const state = {answers: allAnswers, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    // Con todas las capas al máximo, S3* = 0 (captura total)
    Test.assertEquals(d.S3star, 0);
    Test.assert(d.viabilityScore < 50, "Captura total no puede ser viable");
  });
});

Test.suite("VSM · Ashby", () => {
  Test.test("Sistema vacío → variedad 0", () => {
    const d = VSM.evaluate({answers:{}, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS});
    Test.assertEquals(d.varietyBalance, 0);
  });

  Test.test("Entorno alto y sistema bajo → variedad negativa", () => {
    const state = {answers:{
      mat_termo:"x", mat_deuda:"x", mat_clima:"x", mat_activos:"x", mat_pasivos:"x",
      res_cont:"x", res_alt:"x", res_arq:"x", res_rupt:"x"
    }, indicators:{}, layers: DEFAULT_LAYERS, vsmMap: DEFAULT_VSM_MAP, weights: DEFAULT_WEIGHTS};
    const d = VSM.evaluate(state);
    Test.assert(d.varietyBalance < 0);
  });
});

Test.suite("EventBus", () => {
  Test.test("on/emit funciona", () => {
    let received = null;
    const off = EventBus.on("test:event", d => { received = d; });
    EventBus.emit("test:event", {x: 42});
    Test.assertEquals(received.x, 42);
    off();
    received = null;
    EventBus.emit("test:event", {x: 99});
    Test.assertEquals(received, null);
  });

  Test.test("Listener que falla no bloquea a los demás", () => {
    let reached = false;
    EventBus.on("test:fail", () => { throw new Error("fallo intencional"); });
    EventBus.on("test:fail", () => { reached = true; });
    EventBus.emit("test:fail");
    Test.assert(reached);
  });
});
