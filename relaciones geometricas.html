<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Explorador de puntos notables · curvas 2D + esqueleto</title>
<style>
  :root {
    --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --panel:#161922; --border:#2a2f3a;
    --cruce:#ef4444; --tangencia:#22c55e; --cercania:#eab308; --paso:#a855f7;
    --skeleton:#fbbf24; --region:#06b6d4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}

  #app{position:relative;height:100vh;width:100vw}
  #cv{position:absolute;inset:0;display:block;background:var(--bg);cursor:grab;width:100%;height:100%}
  #cv.dragging{cursor:grabbing}

  #panel{
    position:fixed;
    top:60px; right:12px; bottom:12px;
    width:400px;
    max-width:calc(100vw - 24px);
    overflow-y:auto;
    padding:12px;
    background:rgba(22,25,34,.96);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    z-index:10;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
    transition:transform .22s ease, opacity .22s ease;
  }
  #panel.hidden{
    transform:translateX(calc(100% + 24px));
    opacity:0;
    pointer-events:none;
  }

  #toggle-panel{
    position:fixed; top:12px; right:12px; z-index:20;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; padding:0;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }

  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:4px}
  #panel::-webkit-scrollbar-track{background:transparent}

  .section{margin-bottom:16px}
  .section h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .row label{flex:1;color:var(--muted)}
  .row input[type=range]{flex:2}
  .row .val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
  .geom{border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden}
  .geom-header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1c2030;cursor:pointer;user-select:none}
  .geom-header .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .geom-header .name{flex:1;font-weight:600}
  .geom-header .role{font-size:10px;padding:2px 6px;border-radius:3px;background:#2a2f3a;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
  .geom-header .role.objective{background:#1e3a5f;color:#93c5fd}
  .geom-header .role.restriction{background:#3f1f1f;color:#fca5a5}
  .geom-header .role.none{background:#1f2937;color:#6b7280}
  .geom-header .vis{font-size:14px;color:var(--muted);cursor:pointer;width:20px;text-align:center}
  .geom-header .vis.off{opacity:.3}
  .geom-body{padding:8px 10px;display:none}
  .geom.open .geom-body{display:block}
  .result{padding:6px 8px;border-radius:4px;margin-bottom:4px;cursor:pointer;font-size:12px;border-left:3px solid}
  .result:hover{background:#1f2432}
  .result.cruce{border-color:var(--cruce)}
  .result.tangencia{border-color:var(--tangencia)}
  .result.cercania{border-color:var(--cercania)}
  .result.paso{border-color:var(--paso)}
  .badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
  .badge.cruce{background:var(--cruce);color:#fff}
  .badge.tangencia{background:var(--tangencia);color:#000}
  .badge.cercania{background:var(--cercania);color:#000}
  .badge.paso{background:var(--paso);color:#fff}
  button{background:#2a2f3a;color:var(--fg);border:1px solid var(--border);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
  button:hover{background:#353b4a}
  select{background:#2a2f3a;color:var(--fg);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:12px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .filters label{display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;padding:2px 6px;border-radius:3px;background:#1c2030}
  hr{border:0;border-top:1px solid var(--border);margin:12px 0}
  .check{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <aside id="panel">
    <div class="section" id="global-section"></div>
    <div class="section" id="geoms-section"></div>
    <div class="section" id="results-section"></div>
  </aside>
  <button id="toggle-panel" title="Mostrar/ocultar panel (P)">☰</button>
</div>
<script>
"use strict";

const hypot = Math.hypot;
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const DEG = 180/Math.PI;

class EventBus {
  constructor(){ this.h = new Map(); }
  on(ev, fn){ if(!this.h.has(ev)) this.h.set(ev, new Set()); this.h.get(ev).add(fn); return () => this.off(ev, fn); }
  off(ev, fn){ this.h.get(ev)?.delete(fn); }
  emit(ev, data){ this.h.get(ev)?.forEach(fn => fn(data)); }
}

// ============================================================
// MÓDULO 1 · DOMINIO · GEOMETRÍAS (curvas abiertas y regiones)
// ============================================================
class Geometry {
  constructor(cfg){ this.cfg = cfg; }
  eval(_t){ throw new Error("abstract"); }
}

class Recta extends Geometry {
  eval(t){
    const {x1,y1,x2,y2} = this.cfg;
    return { p:[x1+(x2-x1)*t, y1+(y2-y1)*t], d:[x2-x1, y2-y1] };
  }
}

class Espiral extends Geometry {
  eval(t){
    const {cx,cy,a,b,thetaMax} = this.cfg;
    const th = t * thetaMax;
    const r  = a + b*th;
    return {
      p:[cx + r*Math.cos(th), cy + r*Math.sin(th)],
      d:[b*Math.cos(th) - r*Math.sin(th), b*Math.sin(th) + r*Math.cos(th)]
    };
  }
}

class Murray extends Geometry {
  eval(t){
    const {ox,oy,len,angleDeg} = this.cfg;
    const half = (angleDeg*Math.PI/180)/2;
    if (t < 1/3){
      const s = t*3;
      return { p:[ox, oy - s*len], d:[0, -1] };
    } else if (t < 2/3){
      const s = (t - 1/3)*3;
      const ex = ox - Math.sin(half)*len, ey = oy + Math.cos(half)*len;
      return { p:[ox + (ex-ox)*s, oy + (ey-oy)*s], d:[ex-ox, ey-oy] };
    } else {
      const s = (t - 2/3)*3;
      const ex = ox + Math.sin(half)*len, ey = oy + Math.cos(half)*len;
      return { p:[ox + (ex-ox)*s, oy + (ey-oy)*s], d:[ex-ox, ey-oy] };
    }
  }
}

class Clotoide extends Geometry {
  constructor(cfg){
    super(cfg);
    const M = 2000;
    const {x,y,heading,length,kMax} = cfg;
    const ds = length/M;
    let px = x, py = y, th = heading;
    const pts = [[px,py]], tans = [[Math.cos(th), Math.sin(th)]];
    for (let i=0;i<M;i++){
      const s  = (i+0.5)*ds;
      const k  = kMax * s / length;
      const th2 = th + k*ds*0.5;
      px += Math.cos(th2)*ds;
      py += Math.sin(th2)*ds;
      th = th + k*ds;
      pts.push([px,py]);
      tans.push([Math.cos(th), Math.sin(th)]);
    }
    this._pts = pts; this._tans = tans;
  }
  eval(t){
    const M = this._pts.length - 1;
    const i = clamp(t,0,1) * M;
    const i0 = Math.floor(i), i1 = Math.min(M, i0+1);
    const f = i - i0;
    const p0 = this._pts[i0], p1 = this._pts[i1];
    const t0 = this._tans[i0], t1 = this._tans[i1];
    return {
      p:[p0[0]+f*(p1[0]-p0[0]), p0[1]+f*(p1[1]-p0[1])],
      d:[t0[0]+f*(t1[0]-t0[0]), t0[1]+f*(t1[1]-t0[1])]
    };
  }
}

class Bezier extends Geometry {
  eval(t){
    const [p0,p1,p2,p3] = this.cfg.pts;
    const u = 1-t, a = u*u*u, b = 3*u*u*t, c = 3*u*t*t, d = t*t*t;
    const x  = a*p0[0] + b*p1[0] + c*p2[0] + d*p3[0];
    const y  = a*p0[1] + b*p1[1] + c*p2[1] + d*p3[1];
    const dx = 3*u*u*(p1[0]-p0[0]) + 6*u*t*(p2[0]-p1[0]) + 3*t*t*(p3[0]-p2[0]);
    const dy = 3*u*u*(p1[1]-p0[1]) + 6*u*t*(p2[1]-p1[1]) + 3*t*t*(p3[1]-p2[1]);
    return { p:[x,y], d:[dx,dy] };
  }
}

// Poligono: región cerrada. Puede ser rectángulo (cx,cy,w,h) o polígono arbitrario (vertices).
class Poligono extends Geometry {
  get vertices(){
    if (this.cfg.vertices) return this.cfg.vertices;
    const {cx, cy, w, h} = this.cfg;
    return [
      [cx-w/2, cy-h/2], [cx+w/2, cy-h/2],
      [cx+w/2, cy+h/2], [cx-w/2, cy+h/2],
    ];
  }
  eval(t){
    const v = this.vertices;
    const n = v.length;
    const cum = [0];
    for (let i=0;i<n;i++){
      const a = v[i], b = v[(i+1)%n];
      cum.push(cum[i] + Math.hypot(b[0]-a[0], b[1]-a[1]));
    }
    const L = clamp(t,0,1) * cum[n];
    let i = 0;
    while (i < n-1 && cum[i+1] < L) i++;
    const a = v[i], b = v[(i+1)%n];
    const segLen = cum[i+1] - cum[i] || 1;
    const f = (L - cum[i]) / segLen;
    return {
      p: [a[0] + f*(b[0]-a[0]), a[1] + f*(b[1]-a[1])],
      d: [b[0]-a[0], b[1]-a[1]]
    };
  }
}

// ============================================================
// MÓDULO 1 · DOMINIO · SAMPLER, NORMALIZACIÓN, DETECTOR
// ============================================================
function sampleByArcLength(geom, N){
  const M = N*8;
  const rawPts = new Array(M+1), rawTs = new Array(M+1);
  for (let i=0;i<=M;i++){
    const t = i/M;
    const e = geom.eval(t);
    rawPts[i] = e.p; rawTs[i] = t;
  }
  const cum = new Float64Array(M+1);
  for (let i=1;i<=M;i++){
    cum[i] = cum[i-1] + hypot(rawPts[i][0]-rawPts[i-1][0], rawPts[i][1]-rawPts[i-1][1]);
  }
  const L = cum[M] || 1;
  const out = new Array(N);
  let j = 0;
  for (let i=0;i<N;i++){
    const target = (i/(N-1)) * L;
    while (j < M && cum[j+1] < target) j++;
    const t0 = cum[j], t1 = cum[j+1];
    const f = t1 > t0 ? (target - t0)/(t1 - t0) : 0;
    const tt = rawTs[j] + f*(rawTs[j+1]-rawTs[j]);
    out[i] = { t:tt, p: geom.eval(tt).p };
  }
  return out;
}

function normalizePoints(pts, mode, scale){
  if (mode === "none") return pts.map(p => [p[0], p[1]]);
  if (mode === "unite"){
    const s = 1/scale;
    return pts.map(p => [p[0]*s, p[1]*s]);
  }
  if (mode === "minmax"){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const [x,y] of pts){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    const w = maxX-minX || 1, h = maxY-minY || 1;
    return pts.map(([x,y]) => [(x-minX)/w, (y-minY)/h]);
  }
  return pts.map(p => [p[0], p[1]]);
}

function computeTangents(pts){
  const n = pts.length;
  const t = new Array(n);
  for (let i=0;i<n;i++){
    let a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const L = hypot(dx,dy) || 1;
    t[i] = [dx/L, dy/L];
  }
  return t;
}

function findDistanceMinima(A, B, dedupeR){
  const N = A.length, M = B.length;
  const D = new Array(N);
  for (let i=0;i<N;i++){
    const row = new Float32Array(M);
    const [ax, ay] = A[i];
    for (let j=0;j<M;j++){
      row[j] = hypot(ax-B[j][0], ay-B[j][1]);
    }
    D[i] = row;
  }
  const EPS = 1e-9;
  const cands = [];
  for (let i=0;i<N;i++){
    for (let j=0;j<M;j++){
      const v = D[i][j];
      let isMin = true;
      for (let di=-2; di<=2 && isMin; di++){
        for (let dj=-2; dj<=2; dj++){
          if (di===0 && dj===0) continue;
          const ii = i+di, jj = j+dj;
          if (ii<0||ii>=N||jj<0||jj>=M) continue;
          if (D[ii][jj] < v - EPS){ isMin = false; break; }
        }
      }
      if (isMin) cands.push({ i, j, d:v, p:[(A[i][0]+B[j][0])/2, (A[i][1]+B[j][1])/2] });
    }
  }
  cands.sort((a,b) => a.d - b.d);
  const kept = [];
  for (const c of cands){
    if (kept.every(k => hypot(k.p[0]-c.p[0], k.p[1]-c.p[1]) > dedupeR)) kept.push(c);
  }
  return kept;
}

function angleBetween(u, v){
  const nu = hypot(u[0],u[1]), nv = hypot(v[0],v[1]);
  if (nu < 1e-12 || nv < 1e-12) return 0;
  const c = clamp((u[0]*v[0] + u[1]*v[1])/(nu*nv), -1, 1);
  return Math.acos(Math.abs(c));
}

function classify(d, angle, epsD, epsA){
  const touching = d < epsD;
  const parallel = angle < epsA;
  if (touching && !parallel) return "cruce";
  if (touching &&  parallel) return "tangencia";
  if (!touching && parallel) return "cercania";
  return "paso";
}

function detect(states, opts){
  const { mode, N, epsD, epsA, dMax, normMode, normScale } = opts;
  const prepped = [];
  for (const s of states){
    if (!s.visible) continue;
    if (s.showSkeleton) continue; // las regiones con esqueleto no entran en detección de pares
    if (mode === "B" && s.role === "none") continue;
    const raw = sampleByArcLength(s.geom, N);
    const pts = normalizePoints(raw.map(r => r.p), normMode, normScale);
    const tans = computeTangents(pts);
    prepped.push({ id: s.id, role: s.role, pts, tans });
  }
  const pairs = [];
  for (let i=0;i<prepped.length;i++){
    for (let j=i+1;j<prepped.length;j++){
      const a = prepped[i], b = prepped[j];
      if (mode === "B"){
        const ok = (a.role==="objective" && b.role==="restriction") ||
                   (a.role==="restriction" && b.role==="objective");
        if (!ok) continue;
      }
      pairs.push([a, b]);
    }
  }
  const dets = [];
  const dedupeR = Math.max(epsD*3, 0.02);
  for (const [a, b] of pairs){
    const minima = findDistanceMinima(a.pts, b.pts, dedupeR);
    for (const m of minima){
      if (m.d > dMax) continue;
      const ang = angleBetween(a.tans[m.i], b.tans[m.j]);
      const type = classify(m.d, ang, epsD, epsA);
      dets.push({
        x: m.p[0], y: m.p[1], d: m.d, angle: ang, type,
        a: a.id, b: b.id
      });
    }
  }
  return dets;
}

// ============================================================
// MÓDULO 2 · ESQUELETO / DIRECTRIZ DE REGIÓN
// ------------------------------------------------------------
// [DECISIÓN] Esqueleto por "dos aristas equidistantes":
//   - Rasterizamos la región a una rejilla.
//   - Para cada celda dentro, calculamos la distancia a cada arista.
//   - d1, d2 = dos distancias menores; diff = |d1 - d2|.
//   - El eje medio es el conjunto de puntos donde diff = 0 (equidistante
//     a dos aristas) y es mínimo local de diff.
//   Válido para polígonos convexos. Para no convexos aparecen ramas
//   espurias; se resolvería con chequeo de bola maximal (costoso).
// Alternativas: Zhang-Suen thinning, Voronoi de segmentos, distance
// transform + crestas. Cambiar si: quieres esqueleto topológico robusto
// en polígonos no convexos.
// ============================================================
function pointInPolygon(px, py, verts){
  let inside = false;
  const n = verts.length;
  for (let i=0, j=n-1; i<n; j=i++){
    const xi = verts[i][0], yi = verts[i][1];
    const xj = verts[j][0], yj = verts[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
      inside = !inside;
    }
  }
  return inside;
}

function distToSegment(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  const t = len2 > 0 ? clamp(((px-ax)*dx + (py-ay)*dy) / len2, 0, 1) : 0;
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function computeSkeleton(vertices, opts = {}){
  const { resolution = 200, tolerance = 0.02 } = opts;
  const n = vertices.length;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x,y] of vertices){
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const W = maxX - minX, H = maxY - minY;
  const cell = Math.max(W, H) / resolution;
  const nx = Math.ceil(W / cell) + 1;
  const ny = Math.ceil(H / cell) + 1;
  const diff = new Float64Array(nx * ny).fill(1e9);
  const dmin = new Float64Array(nx * ny).fill(-1);
  for (let j=0;j<ny;j++){
    for (let i=0;i<nx;i++){
      const px = minX + i*cell;
      const py = minY + j*cell;
      if (!pointInPolygon(px, py, vertices)) continue;
      let d1 = Infinity, d2 = Infinity;
      for (let e=0;e<n;e++){
        const a = vertices[e], b = vertices[(e+1)%n];
        const d = distToSegment(px, py, a[0], a[1], b[0], b[1]);
        if (d < d1){ d2 = d1; d1 = d; }
        else if (d < d2){ d2 = d; }
      }
      const idx = j*nx + i;
      diff[idx] = d2 - d1;
      dmin[idx] = d1;
    }
  }
  const pts = [];
  for (let j=1;j<ny-1;j++){
    for (let i=1;i<nx-1;i++){
      const idx = j*nx + i;
      if (dmin[idx] < 0) continue;
      const v = diff[idx];
      if (v > tolerance) continue;
      let isMin = true;
      for (let dj=-1; dj<=1 && isMin; dj++){
        for (let di=-1; di<=1; di++){
          if (dj===0 && di===0) continue;
          const nidx = (j+dj)*nx + (i+di);
          if (dmin[nidx] < 0) continue;
          if (diff[nidx] < v - 1e-9){ isMin = false; break; }
        }
      }
      if (!isMin) continue;
      pts.push({ x: minX + i*cell, y: minY + j*cell, d: dmin[idx] });
    }
  }
  return { points: pts, cell, bbox: {minX, minY, maxX, maxY} };
}

// ============================================================
// ADAPTADOR CANVAS
// ============================================================
class CanvasRenderer {
  constructor(canvas, bus){
    this.cv = canvas;
    this.ctx = canvas.getContext("2d");
    this.bus = bus;
    this.view = { cx: 0, cy: 0, scale: 100 };
    this.highlight = null;
    this._bindPanZoom();
    this._bindHover();
    window.addEventListener("resize", () => this.resize());
    this.resize();
  }
  resize(){
    const dpr = window.devicePixelRatio || 1;
    const r = this.cv.getBoundingClientRect();
    this.cv.width  = Math.floor(r.width  * dpr);
    this.cv.height = Math.floor(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.bus.emit("view:change");
  }
  worldToScreen([x,y]){
    return [
      (x - this.view.cx) * this.view.scale + this.cv.clientWidth/2,
      -(y - this.view.cy) * this.view.scale + this.cv.clientHeight/2
    ];
  }
  screenToWorld([sx,sy]){
    return [
      (sx - this.cv.clientWidth/2)/this.view.scale + this.view.cx,
      -(sy - this.cv.clientHeight/2)/this.view.scale + this.view.cy
    ];
  }
  fitToGeometries(states){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const s of states){
      if (!s.visible) continue;
      const pts = sampleByArcLength(s.geom, 100);
      for (const {p:[x,y]} of pts){
        if (x<minX) minX=x; if (x>maxX) maxX=x;
        if (y<minY) minY=y; if (y>maxY) maxY=y;
      }
    }
    if (!isFinite(minX)) return;
    const w = maxX-minX || 1, h = maxY-minY || 1;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    this.view.cx = (minX+maxX)/2;
    this.view.cy = (minY+maxY)/2;
    this.view.scale = Math.min(W/(w*1.15), H/(h*1.15));
    this.bus.emit("view:change");
  }
  setHighlight(idx){ this.highlight = idx; this.bus.emit("view:change"); }
  _bindPanZoom(){
    const cv = this.cv;
    let drag = null;
    cv.addEventListener("mousedown", e => {
      drag = { x:e.offsetX, y:e.offsetY, cx:this.view.cx, cy:this.view.cy };
      cv.classList.add("dragging");
    });
    window.addEventListener("mousemove", e => {
      if (!drag) return;
      this.view.cx = drag.cx - (e.offsetX - drag.x)/this.view.scale;
      this.view.cy = drag.cy + (e.offsetY - drag.y)/this.view.scale;
      this.bus.emit("view:change");
    });
    window.addEventListener("mouseup", () => {
      drag = null;
      cv.classList.remove("dragging");
    });
    cv.addEventListener("wheel", e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.15 : 1/1.15;
      const mouse = [e.offsetX, e.offsetY];
      const before = this.screenToWorld(mouse);
      this.view.scale *= f;
      const after = this.screenToWorld(mouse);
      this.view.cx += before[0] - after[0];
      this.view.cy += before[1] - after[1];
      this.bus.emit("view:change");
    }, { passive:false });
  }
  _bindHover(){
    this.cv.addEventListener("mousemove", e => {
      if (!this._lastDets) return;
      const [mx,my] = [e.offsetX, e.offsetY];
      let best = null, bestD = 12;
      for (let i=0;i<this._lastDets.length;i++){
        const d = this._lastDets[i];
        const [sx,sy] = this.worldToScreen([d.x,d.y]);
        const dd = hypot(sx-mx, sy-my);
        if (dd < bestD){ bestD = dd; best = i; }
      }
      if (best !== this.highlight){ this.highlight = best; this.bus.emit("view:change"); }
    });
  }
  draw(state, dets){
    this._lastDets = dets;
    const ctx = this.ctx;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    this._drawGrid(W,H);

    // Curvas y regiones
    for (const s of state.geometries){
      if (!s.visible) continue;
      const pts = sampleByArcLength(s.geom, 300);
      ctx.beginPath();
      let started = false;
      for (const {p} of pts){
        const [sx,sy] = this.worldToScreen(p);
        if (!started){ ctx.moveTo(sx,sy); started = true; }
        else ctx.lineTo(sx,sy);
      }
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.role === "objective" ? 2.5 : 1.5;
      ctx.setLineDash(s.role === "objective" ? [] : s.role === "none" ? [4,4] : []);
      ctx.stroke();
      ctx.setLineDash([]);

      // Esqueleto de la región
      if (s.showSkeleton && s.skeleton){
        ctx.fillStyle = "rgba(251, 191, 36, 0.85)";
        for (const p of s.skeleton.points){
          const [sx,sy] = this.worldToScreen([p.x, p.y]);
          ctx.fillRect(sx-1.2, sy-1.2, 2.4, 2.4);
        }
      }
    }

    // Detecciones del módulo 1
    const colors = { cruce:"#ef4444", tangencia:"#22c55e", cercania:"#eab308", paso:"#a855f7" };
    for (let i=0;i<dets.length;i++){
      const d = dets[i];
      if (!state.filters[d.type]) continue;
      const [sx,sy] = this.worldToScreen([d.x,d.y]);
      const r = i === this.highlight ? 8 : 5;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.fillStyle = colors[d.type];
      ctx.fill();
      ctx.strokeStyle = i === this.highlight ? "#fff" : "rgba(0,0,0,0.6)";
      ctx.lineWidth = i === this.highlight ? 2 : 1;
      ctx.stroke();
    }
  }
  _drawGrid(W,H){
    const ctx = this.ctx;
    const step = niceStep(60 / this.view.scale);
    const x0 = this.screenToWorld([0,0])[0];
    const x1 = this.screenToWorld([W,0])[0];
    const y0 = this.screenToWorld([0,H])[1];
    const y1 = this.screenToWorld([0,0])[1];
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.ceil(x0/step)*step; x <= x1; x += step){
      const [sx] = this.worldToScreen([x,0]); ctx.moveTo(sx,0); ctx.lineTo(sx,H);
    }
    for (let y = Math.ceil(y0/step)*step; y <= y1; y += step){
      const [,sy] = this.worldToScreen([0,y]); ctx.moveTo(0,sy); ctx.lineTo(W,sy);
    }
    ctx.stroke();
  }
}
function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw/p;
  return p * (n<1.5?1 : n<3.5?2 : n<7.5?5 : 10);
}

// ============================================================
// ADAPTADOR CONTROLES
// ============================================================
class ControlsPanel {
  constructor(bus, app){ this.bus = bus; this.app = app; }
  mount(){
    this._buildGlobal(document.getElementById("global-section"));
    this._buildGeoms(document.getElementById("geoms-section"));
    this._buildResults(document.getElementById("results-section"));
  }
  _buildGlobal(root){
    root.innerHTML = "";
    const h = document.createElement("h3"); h.textContent = "Parámetros globales"; root.appendChild(h);
    const S = this.app.state;
    const mk = (label, el) => {
      const row = document.createElement("div");
      row.className = "row";
      const l = document.createElement("label"); l.textContent = label;
      row.appendChild(l); row.appendChild(el);
      root.appendChild(row);
    };
    const modeSel = document.createElement("select");
    for (const [k,v] of [["A","A · todos contra todos"],["B","B · objetivo × restricción"]]){
      const o = document.createElement("option"); o.value=k; o.textContent=v; modeSel.appendChild(o);
    }
    modeSel.value = S.mode;
    modeSel.onchange = () => { S.mode = modeSel.value; this.bus.emit("state:change"); this._refreshRoles(); };
    mk("Modo", modeSel);

    root.appendChild(document.createElement("hr"));

    const slider = (label, key, min, max, step, fmt) => {
      const inp = document.createElement("input");
      inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = S[key];
      const val = document.createElement("span"); val.className = "val"; val.textContent = fmt(S[key]);
      inp.oninput = () => { S[key] = parseFloat(inp.value); val.textContent = fmt(S[key]); this.bus.emit("state:change"); };
      const row = document.createElement("div");
      row.className = "row";
      const l = document.createElement("label"); l.textContent = label;
      row.append(l, inp, val);
      root.appendChild(row);
    };
    slider("N muestras",    "N",       100, 800, 50, v => v|0);
    slider("ε_d (dist)",    "epsD",   0.005, 0.3, 0.005, v => v.toFixed(3));
    slider("ε_a (ángulo)",  "epsA",   0.01, 0.6, 0.01, v => (v*DEG).toFixed(1)+"°");
    slider("d_max cutoff",  "dMax",   0.05, 1.5, 0.05, v => v.toFixed(2));

    const normRow = document.createElement("div"); normRow.className = "row";
    const nl = document.createElement("label"); nl.textContent = "Norm";
    const ns = document.createElement("select");
    for (const m of ["none","unite","minmax"]){
      const o = document.createElement("option"); o.value=m; o.textContent=m; ns.appendChild(o);
    }
    ns.value = S.normMode;
    ns.onchange = () => { S.normMode = ns.value; this.bus.emit("state:change"); this._buildGlobal(root); };
    normRow.append(nl, ns);
    root.appendChild(normRow);
    if (S.normMode !== "none"){
      slider("scale norm", "normScale", 1, 20, 0.5, v => v.toFixed(1));
    }

    root.appendChild(document.createElement("hr"));
    const h2 = document.createElement("h3"); h2.textContent = "Esqueleto de regiones"; root.appendChild(h2);
    slider("resolución esq.", "skeletonResolution", 80, 400, 20, v => v|0);
    slider("tolerancia esq.", "skeletonTolerance", 0.005, 0.15, 0.005, v => v.toFixed(3));

    const f = document.createElement("div"); f.className = "filters";
    for (const t of ["cruce","tangencia","cercania","paso"]){
      const lab = document.createElement("label");
      const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = S.filters[t];
      cb.onchange = () => { S.filters[t] = cb.checked; this.bus.emit("view:change"); };
      lab.append(cb, document.createTextNode(t));
      f.appendChild(lab);
    }
    root.appendChild(f);

    const btn = document.createElement("button");
    btn.textContent = "Ajustar vista";
    btn.style.marginTop = "8px";
    btn.onclick = () => this.app.renderer.fitToGeometries(this.app.state.geometries);
    root.appendChild(btn);
  }
  _buildGeoms(root){
    root.innerHTML = "";
    const h = document.createElement("h3"); h.textContent = "Geometrías"; root.appendChild(h);
    for (const g of this.app.state.geometries){
      root.appendChild(this._buildGeomBlock(g));
    }
  }
  _buildGeomBlock(g){
    const box = document.createElement("div"); box.className = "geom";
    const hd = document.createElement("div"); hd.className = "geom-header";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = g.color;
    const name = document.createElement("span"); name.className = "name"; name.textContent = g.label;
    const vis = document.createElement("span"); vis.className = "vis" + (g.visible?"":" off"); vis.textContent = g.visible ? "◉" : "○";
    vis.onclick = (e) => { e.stopPropagation(); g.visible = !g.visible; vis.textContent = g.visible?"◉":"○"; vis.classList.toggle("off", !g.visible); this.bus.emit("state:change"); };
    const role = document.createElement("span"); role.className = "role " + g.role; role.textContent = g.role;
    role.onclick = (e) => {
      e.stopPropagation();
      const cycle = { "none":"restriction", "restriction":"objective", "objective":"none" };
      g.role = cycle[g.role];
      role.className = "role " + g.role; role.textContent = g.role;
      this.bus.emit("state:change");
    };
    hd.append(dot, name, role, vis);
    const body = document.createElement("div"); body.className = "geom-body";
    hd.onclick = () => box.classList.toggle("open");

    // Checkbox de esqueleto para polígonos
    if (g.geom instanceof Poligono){
      const ck = document.createElement("label");
      ck.className = "check";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!g.showSkeleton;
      cb.onchange = () => { g.showSkeleton = cb.checked; this.bus.emit("state:change"); };
      ck.append(cb, document.createTextNode(" Mostrar esqueleto (directriz)"));
      body.appendChild(ck);
    }

    for (const [key, spec] of Object.entries(g.paramSpec)){
      const row = document.createElement("div"); row.className = "row";
      const l = document.createElement("label"); l.textContent = spec.label;
      const inp = document.createElement("input"); inp.type="range";
      inp.min = spec.min; inp.max = spec.max; inp.step = spec.step; inp.value = g.params[key];
      const val = document.createElement("span"); val.className = "val"; val.textContent = spec.fmt(g.params[key]);
      inp.oninput = () => { g.params[key] = parseFloat(inp.value); val.textContent = spec.fmt(g.params[key]); this.bus.emit("state:change"); };
      row.append(l, inp, val);
      body.appendChild(row);
    }
    box.append(hd, body);
    return box;
  }
  _refreshRoles(){ this._buildGeoms(document.getElementById("geoms-section")); }
  _buildResults(root){ this._resultsRoot = root; }
  updateResults(dets){
    const root = this._resultsRoot;
    root.innerHTML = "";
    const h = document.createElement("h3"); h.textContent = `Detecciones (${dets.length})`; root.appendChild(h);
    const list = document.createElement("div"); list.className = "list";
    for (let i=0;i<dets.length;i++){
      const d = dets[i];
      const div = document.createElement("div");
      div.className = "result " + d.type;
      div.innerHTML = `<span class="badge ${d.type}">${d.type}</span>
        (${d.x.toFixed(2)}, ${d.y.toFixed(2)}) · d=${d.d.toFixed(3)} · ∠=${(d.angle*DEG).toFixed(1)}°`;
      div.onclick = () => this.app.renderer.setHighlight(i);
      list.appendChild(div);
    }
    root.appendChild(list);

    // Resumen de esqueletos
    const skels = this.app.state.geometries.filter(g => g.showSkeleton && g.skeleton);
    if (skels.length){
      const h2 = document.createElement("h3"); h2.textContent = "Esqueletos"; h2.style.marginTop = "12px";
      root.appendChild(h2);
      for (const g of skels){
        const div = document.createElement("div");
        div.className = "result";
        div.style.borderColor = "#fbbf24";
        div.innerHTML = `<span class="badge" style="background:#fbbf24;color:#000">${g.label}</span>
          ${g.skeleton.points.length} puntos de eje medio`;
        list.appendChild(div);
        root.appendChild(div);
      }
    }
  }
}

// APLICACIÓN
// ============================================================
class App {
  constructor(){
    this.bus = new EventBus();
    this.state = {
      mode:"A",
      N: 400,
      epsD: 0.05,
      epsA: 0.15,
      dMax: 0.4,
      normMode: "none",
      normScale: 5,
      skeletonResolution: 200,
      skeletonTolerance: 0.02,
      filters: { cruce:true, tangencia:true, cercania:true, paso:false },
      geometries: this._defaultGeometries(),
    };
    this.renderer = new CanvasRenderer(document.getElementById("cv"), this.bus);
    this.controls = new ControlsPanel(this.bus, this);
    this.dets = [];
    this._wired = false;
    this._pendingDetect = null;
  }
  _mkGeom(id, label, color, role, geom, paramSpec, showSkeleton = false){
    let params;
    if (id === "bezier"){
      const [p0,p1,p2,p3] = geom.cfg.pts;
      params = {
        p0x:p0[0], p0y:p0[1], p1x:p1[0], p1y:p1[1],
        p2x:p2[0], p2y:p2[1], p3x:p3[0], p3y:p3[1],
      };
    } else {
      params = { ...geom.cfg };
    }
    return { id, label, color, role, geom, params, paramSpec, visible:true, showSkeleton, skeleton:null };
  }
  _defaultGeometries(){
    return [
      this._mkGeom("cuadrado", "Región", "#06b6d4", "none",
        new Poligono({cx:0, cy:0, w:4, h:3}), {
        cx:{label:"cx",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        cy:{label:"cy",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        w:{label:"ancho",min:0.5,max:10,step:0.1,fmt:v=>v.toFixed(1)},
        h:{label:"alto",min:0.5,max:10,step:0.1,fmt:v=>v.toFixed(1)},
      }, true),
      this._mkGeom("recta", "Recta", "#60a5fa", "restriction",
        new Recta({x1:-3,y1:-3,x2:3,y2:3}), {
        x1:{label:"x1",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        y1:{label:"y1",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        x2:{label:"x2",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        y2:{label:"y2",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
      }),
      this._mkGeom("espiral", "Espiral", "#f472b6", "restriction",
        new Espiral({cx:0,cy:0,a:0.3,b:0.35,thetaMax:4*Math.PI}), {
        cx:{label:"cx",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        cy:{label:"cy",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        a:{label:"a",min:0.05,max:2,step:0.05,fmt:v=>v.toFixed(2)},
        b:{label:"b",min:0.05,max:1,step:0.05,fmt:v=>v.toFixed(2)},
        thetaMax:{label:"θ_max",min:1,max:20,step:0.5,fmt:v=>v.toFixed(1)},
      }),
      this._mkGeom("murray", "Murray", "#34d399", "restriction",
        new Murray({ox:0,oy:0,len:2.5,angleDeg:75}), {
        ox:{label:"ox",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        oy:{label:"oy",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        len:{label:"len",min:0.5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        angleDeg:{label:"ángulo",min:30,max:120,step:1,fmt:v=>v.toFixed(0)+"°"},
      }),
      this._mkGeom("clotoide", "Clotoide", "#f59e0b", "restriction",
        new Clotoide({x:-4,y:1,heading:0,length:6,kMax:0.3}), {
        x:{label:"x0",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        y:{label:"y0",min:-5,max:5,step:0.1,fmt:v=>v.toFixed(1)},
        heading:{label:"heading",min:-3.14,max:3.14,step:0.1,fmt:v=>v.toFixed(2)},
        length:{label:"L",min:1,max:10,step:0.5,fmt:v=>v.toFixed(1)},
        kMax:{label:"k_max",min:0.05,max:1,step:0.05,fmt:v=>v.toFixed(2)},
      }),
      this._mkGeom("bezier", "Bézier", "#a78bfa", "restriction",
        new Bezier({pts:[[-3,2],[-1,4],[1,-4],[3,-2]]}), {
        p0x:{label:"p0.x",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p0y:{label:"p0.y",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p1x:{label:"p1.x",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p1y:{label:"p1.y",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p2x:{label:"p2.x",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p2y:{label:"p2.y",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p3x:{label:"p3.x",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
        p3y:{label:"p3.y",min:-8,max:8,step:0.1,fmt:v=>v.toFixed(1)},
      }),
    ];
  }
  _syncGeomParams(){
    for (const g of this.state.geometries){
      if (g.id === "bezier"){
        g.geom.cfg.pts = [
          [g.params.p0x, g.params.p0y],
          [g.params.p1x, g.params.p1y],
          [g.params.p2x, g.params.p2y],
          [g.params.p3x, g.params.p3y],
        ];
        continue;
      }
      Object.assign(g.geom.cfg, g.params);
    }
  }
  _recomputeSkeletons(){
    for (const g of this.state.geometries){
      if (g.showSkeleton && g.geom instanceof Poligono){
        g.skeleton = computeSkeleton(g.geom.vertices, {
          resolution: this.state.skeletonResolution,
          tolerance: this.state.skeletonTolerance,
        });
      } else {
        g.skeleton = null;
      }
    }
  }
  wire(){
    if (this._wired) return;
    this._wired = true;
    this.controls.mount();
    this.bus.on("state:change", () => this._scheduleDetect());
    this.bus.on("view:change",  () => this._draw());
    this.bus.on("display:change", () => this._draw());
    this._scheduleDetect(true);
  }
  _scheduleDetect(force = false){
    if (force){ this._detect(); return; }
    if (this._pendingDetect) clearTimeout(this._pendingDetect);
    this._pendingDetect = setTimeout(() => { this._pendingDetect = null; this._detect(); }, 60);
  }
  _detect(){
    this._syncGeomParams();
    this._recomputeSkeletons();
    this.dets = detect(this.state.geometries, {
      mode: this.state.mode,
      N: this.state.N,
      epsD: this.state.epsD,
      epsA: this.state.epsA,
      dMax: this.state.dMax,
      normMode: this.state.normMode,
      normScale: this.state.normScale,
    });
    this._draw();
    this.controls.updateResults(this.dets);
  }
  _draw(){
    this.renderer.draw(this.state, this.dets);
  }
}

// ============================================================
// TESTS
// ============================================================
function runTests(){
  console.group("%cTests · dominio geométrico", "color:#60a5fa;font-weight:bold");
  const t = (name, cond, extra="") => {
    if (cond) console.log(`  ✅ ${name}`);
    else console.error(`  ❌ ${name} ${extra}`);
  };
  const approx = (a,b,eps=1e-6) => Math.abs(a-b) < eps;

  // Módulo 1: detector
  const l1 = new Recta({x1:-1,y1:0,x2:1,y2:0});
  const l2 = new Recta({x1:0,y1:-1,x2:0,y2:1});
  let dets = detect(
    [{id:"a",visible:true,role:"restriction",geom:l1,showSkeleton:false},
     {id:"b",visible:true,role:"restriction",geom:l2,showSkeleton:false}],
    {mode:"A",N:200,epsD:0.05,epsA:0.15,dMax:0.5,normMode:"none",normScale:1});
  const cruces = dets.filter(d => d.type==="cruce");
  t("perpendiculares → 1 cruce", cruces.length===1, `got ${cruces.length}`);
  if (cruces.length) t("cruce en (0,0)", approx(cruces[0].x,0,0.02) && approx(cruces[0].y,0,0.02), JSON.stringify(cruces[0]));

  const l3 = new Recta({x1:-1,y1:0.5,x2:1,y2:0.5});
  dets = detect(
    [{id:"a",visible:true,role:"restriction",geom:l1,showSkeleton:false},
     {id:"b",visible:true,role:"restriction",geom:l3,showSkeleton:false}],
    {mode:"A",N:200,epsD:0.05,epsA:0.15,dMax:1.0,normMode:"none",normScale:1});
  t("paralelas → 0 cruces", dets.filter(d=>d.type==="cruce").length===0);
  t("paralelas → al menos 1 cercanía", dets.some(d=>d.type==="cercania"));

  const circulo = {
    eval(t){
      const th = t*2*Math.PI;
      return { p:[Math.cos(th), 1+Math.sin(th)], d:[-Math.sin(th), Math.cos(th)] };
    }
  };
  dets = detect(
    [{id:"a",visible:true,role:"restriction",geom:l1,showSkeleton:false},
     {id:"b",visible:true,role:"restriction",geom:circulo,showSkeleton:false}],
    {mode:"A",N:400,epsD:0.08,epsA:0.25,dMax:0.5,normMode:"none",normScale:1});
  const tan = dets.filter(d=>d.type==="tangencia");
  t("tangencia detectada (1)", tan.length===1, `got ${tan.length} types=${dets.map(d=>d.type).join(",")}`);
  if (tan.length) t("tangencia en (0,0)", approx(tan[0].x,0,0.03) && approx(tan[0].y,0,0.03), JSON.stringify(tan[0]));

  const lejos = new Recta({x1:10,y1:10,x2:12,y2:10});
  dets = detect(
    [{id:"a",visible:true,role:"restriction",geom:l1,showSkeleton:false},
     {id:"b",visible:true,role:"restriction",geom:lejos,showSkeleton:false}],
    {mode:"A",N:200,epsD:0.05,epsA:0.15,dMax:0.5,normMode:"none",normScale:1});
  t("lejanas → 0", dets.length===0, `got ${dets.length}`);

  const bz = new Bezier({pts:[[0,0],[3,0],[3,3],[0,3]]});
  const sp = sampleByArcLength(bz, 100);
  const dists = [];
  for (let i=1;i<sp.length;i++) dists.push(hypot(sp[i].p[0]-sp[i-1].p[0], sp[i].p[1]-sp[i-1].p[1]));
  const avg = dists.reduce((s,x)=>s+x,0)/dists.length;
  const maxDev = Math.max(...dists.map(d=>Math.abs(d-avg)));
  t("sampler: desviación < 2% del paso", maxDev/avg < 0.02, `avg=${avg.toFixed(4)} dev=${maxDev.toFixed(4)}`);

  const diag = new Recta({x1:0,y1:0,x2:1,y2:1});
  const rawPts = sampleByArcLength(diag, 20).map(s=>s.p);
  const norm = normalizePoints(rawPts, "unite", 5);
  const tRaw = [rawPts[1][0]-rawPts[0][0], rawPts[1][1]-rawPts[0][1]];
  const tNorm = [norm[1][0]-norm[0][0], norm[1][1]-norm[0][1]];
  t("unite preserva ángulo", approx(angleBetween(tRaw,tNorm), 0, 1e-6));

  t("clasif: d<ε_d, no paralelo → cruce",     classify(0.01, 1.0, 0.05, 0.15)==="cruce");
  t("clasif: d<ε_d, paralelo → tangencia",    classify(0.01, 0.05, 0.05, 0.15)==="tangencia");
  t("clasif: d>ε_d, paralelo → cercanía",     classify(0.5, 0.05, 0.05, 0.15)==="cercania");
  t("clasif: d>ε_d, no paralelo → paso",      classify(0.5, 1.0, 0.05, 0.15)==="paso");

  const st = [
    {id:"a",visible:true,role:"objective",  geom:l1, showSkeleton:false},
    {id:"b",visible:true,role:"restriction",geom:l2, showSkeleton:false},
    {id:"c",visible:true,role:"restriction",geom:l3, showSkeleton:false},
  ];
  dets = detect(st, {mode:"B",N:200,epsD:0.05,epsA:0.15,dMax:0.6,normMode:"none",normScale:1});
  const pares = new Set(dets.map(d=>[d.a,d.b].sort().join("-")));
  t("modo B: solo objetivo×restricción", ![...pares].includes("b-c"));

  // Módulo 2: esqueleto
  console.group("Tests · esqueleto de región");
  const sq = new Poligono({cx:0.5, cy:0.5, w:1, h:1});
  const sk = computeSkeleton(sq.vertices, {resolution: 120, tolerance: 0.03});
  t("esqueleto de cuadrado no vacío", sk.points.length > 20, `got ${sk.points.length}`);
  let onDiag = 0;
  for (const p of sk.points){
    if (Math.abs(Math.abs(p.x-0.5) - Math.abs(p.y-0.5)) < 0.05) onDiag++;
  }
  t("mayoría en diagonales del cuadrado", onDiag / sk.points.length > 0.7, `${(100*onDiag/sk.points.length).toFixed(1)}%`);

  const rect = new Poligono({cx:0, cy:0, w:4, h:1});
  const sk2 = computeSkeleton(rect.vertices, {resolution: 160, tolerance: 0.03});
  t("esqueleto de rectángulo no vacío", sk2.points.length > 20, `got ${sk2.points.length}`);
  // Comprobar que hay puntos cerca de la línea central y=0
  let onCenter = 0;
  for (const p of sk2.points){
    if (Math.abs(p.y) < 0.1) onCenter++;
  }
  t("rectángulo: hay eje central en y=0", onCenter > 10, `got ${onCenter}`);

  const lejosDelBorde = computeSkeleton(new Poligono({cx:0,cy:0,w:1,h:1}).vertices, {resolution: 100, tolerance: 0.02});
  let allInside = true;
  for (const p of lejosDelBorde.points){
    if (!pointInPolygon(p.x, p.y, [[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]])){
      allInside = false; break;
    }
  }
  t("puntos del esqueleto dentro del polígono", allInside);
  console.groupEnd();

  console.groupEnd();
}

// ============================================================
// BOOT
// ============================================================
window.addEventListener("DOMContentLoaded", () => {
  runTests();
  const app = new App();
  app.wire();

  const panel = document.getElementById("panel");
  const btnToggle = document.getElementById("toggle-panel");
  btnToggle.addEventListener("click", () => panel.classList.toggle("hidden"));
  window.addEventListener("keydown", (e) => {
    if (e.key === "p" || e.key === "P") panel.classList.toggle("hidden");
  });

  requestAnimationFrame(() => app.renderer.fitToGeometries(app.state.geometries));
  window.__app = app;
});
</script>
