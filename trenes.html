<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulador red ferroviaria · v2</title>
<style>
  :root {
    --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --panel:#161922;
    --border:#2a2f3a; --accent:#22d3ee; --warn:#f59e0b; --danger:#ef4444;
    --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,sans-serif;
    background:var(--bg);color:var(--fg);overflow:hidden}
  #app{display:grid;grid-template-columns:1fr 400px;height:100vh}
  #cv-wrap{position:relative;overflow:hidden;background:var(--bg)}
  #cv{display:block;width:100%;height:100%;cursor:grab}
  #cv.dragging{cursor:grabbing}
  #panel{background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;padding:12px;font-size:13px}
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:4px}
  h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .row label{flex:1;color:var(--muted)}
  .row input[type=range]{flex:2}
  .row .val{min-width:72px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
  select,input[type=number],button{
    background:#2a2f3a;color:var(--fg);border:1px solid var(--border);
    padding:4px 8px;border-radius:4px;font-size:12px;font-family:inherit}
  button{cursor:pointer}
  button:hover{background:#353b4a}
  button.primary{background:#1e3a5f;border-color:#2a4a7f}
  button.primary:hover{background:#2a4a7f}
  button.active{background:#1e3a5f;border-color:#2a4a7f}
  button.danger{background:#3f1f1f;border-color:#6b2020}
  button.danger:hover{background:#6b2020}
  .disclaimer{font-size:11px;color:var(--warn);padding:6px 8px;
    border:1px solid var(--warn);border-radius:4px;margin-bottom:12px;
    background:rgba(245,158,11,.08);line-height:1.4}
  .stats{display:grid;grid-template-columns:1fr auto;gap:2px 12px;
    font-size:12px;padding:8px;background:#1c2030;border-radius:4px;
    font-variant-numeric:tabular-nums}
  .stats dt{color:var(--muted);margin:0}
  .stats dd{margin:0;text-align:right}
  hr{border:0;border-top:1px solid var(--border);margin:12px 0}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:11px}
  .legend-item{display:flex;align-items:center;gap:4px}
  .legend-swatch{width:12px;height:3px;border-radius:1px}
  .legend-dot{width:10px;height:10px;border-radius:50%}
  #zoom-indicator{position:absolute;top:10px;left:10px;padding:3px 8px;
    background:rgba(22,25,34,.85);border:1px solid var(--border);
    border-radius:4px;font-size:11px;color:var(--muted);pointer-events:none;
    font-variant-numeric:tabular-nums}
  #view-controls{position:absolute;top:10px;right:10px;display:flex;
    flex-direction:column;gap:4px;z-index:5}
  #view-controls button{width:32px;height:32px;padding:0;font-size:14px;font-weight:600}
  #toast{position:fixed;bottom:16px;left:16px;padding:8px 12px;
    background:#1e3a5f;border:1px solid #2a4a7f;border-radius:6px;
    font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  #toast.visible{opacity:1}

  /* Drawer */
  #drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);
    display:none;z-index:100}
  #drawer-overlay.visible{display:block}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:420px;
    max-width:90vw;background:var(--panel);border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .22s ease;
    overflow-y:auto;z-index:101;padding:16px;font-size:13px}
  #drawer.visible{transform:translateX(0)}
  #drawer h2{margin-top:0;font-size:16px;text-transform:none;color:var(--fg)}
  #drawer h3{margin:16px 0 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted)}
  #drawer .close{position:absolute;top:12px;right:12px;width:32px;height:32px;padding:0;font-size:18px}
  .check-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
  .check-row label{flex:1;display:flex;align-items:center;gap:6px;cursor:pointer}
  .check-row .coste{color:var(--warn);font-size:11px}
  .tag{display:inline-block;padding:1px 6px;border-radius:3px;
    font-size:10px;margin-right:4px;text-transform:uppercase;color:#000}
  .inv-list{font-size:11px;color:var(--muted);margin-top:4px}
  .inv-list div{padding:2px 0}
  .node-summary{padding:8px;background:#1c2030;border-radius:4px;
    font-size:12px;line-height:1.5;margin-bottom:8px}
  .conn-list{font-size:11px;color:var(--muted);line-height:1.6}
  .conn-list .alta{color:var(--fg)}
  .conn-list .def{color:#6b7280}
</style>
</head>
<body>
<div id="app">
  <div id="cv-wrap">
    <canvas id="cv"></canvas>
    <div id="zoom-indicator">100%</div>
    <div id="view-controls">
      <button id="btn-zoom-in" title="Acercar">+</button>
      <button id="btn-zoom-out" title="Alejar">−</button>
      <button id="btn-zoom-reset" title="Reset vista">⟲</button>
    </div>
  </div>
  <aside id="panel">
    <div class="disclaimer">⚠️ Simulador exploratorio. Datos base aproximados; configuraciones potenciales. No es una predicción.</div>

    <h2>Objetivo</h2>
    <div class="row"><select id="sel-obj" style="flex:1"></select></div>
    <div class="row">
      <label>α distancia</label>
      <input type="range" id="rng-alpha" min="0.8" max="2.5" step="0.1" value="1.5">
      <span class="val" id="val-alpha">1.5</span>
    </div>
    <div class="row">
      <label>Sinuosidad</label>
      <input type="range" id="rng-sin" min="1" max="1.8" step="0.05" value="1.25">
      <span class="val" id="val-sin">1.25</span>
    </div>

    <hr>
    <h2>Presupuesto</h2>
    <div class="row">
      <label>Total</label>
      <input type="range" id="rng-pres" min="0" max="100000" step="1000" value="20000">
      <span class="val" id="val-pres">20.000 M€</span>
    </div>
    <div class="row">
      <button class="primary" id="btn-build" style="flex:1">Construir óptimo</button>
      <button id="btn-clear">Limpiar</button>
    </div>

    <hr>
    <h2>Perturbación</h2>
    <div class="row">
      <button id="btn-perturbar" style="flex:1">Perturbar ±20%</button>
      <button id="btn-perturbar-reset">Reset</button>
    </div>
    <div class="row"><span id="perturbar-status" style="color:var(--muted);font-size:11px">Sin perturbar</span></div>

    <hr>
    <h2>Vista</h2>
    <div class="row">
      <button id="btn-hex" style="flex:1">Hex</button>
      <button id="btn-geo" style="flex:1">Geográfico</button>
    </div>
    <div class="row"><label><input type="checkbox" id="cb-exist" checked> Red existente</label></div>
    <div class="row"><label><input type="checkbox" id="cb-cand" checked> Candidatas (top 15)</label></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:#1f2937"></div>Existente buena</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#4b5563"></div>Deficiente</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ef4444"></div>Propuesta</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f59e0b"></div>Candidata</div>
    </div>

    <hr>
    <h2>Costes</h2>
    <dl class="stats" id="stats-costes"></dl>
    <h2 style="margin-top:12px">Demanda</h2>
    <dl class="stats" id="stats-demanda"></dl>

    <hr>
    <h2>Nodo</h2>
    <div id="node-info" style="color:var(--muted);font-size:12px">Click en un nodo para configurarlo.</div>
  </aside>
</div>

<div id="drawer-overlay"></div>
<aside id="drawer">
  <button class="close" id="btn-drawer-close">×</button>
  <div id="drawer-content"></div>
</aside>

<div id="toast"></div>

"use strict";

// Polyfill roundRect
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
  };
}

// SECCIÓN 1: EVENT BUS
// Sistema pub/sub simple. Todo cambio de estado emite 'change'
// y los módulos suscritos se actualizan.
// ============================================================
class EventBus {
  constructor(){ this.h = new Map(); }
  on(ev, fn){ if(!this.h.has(ev)) this.h.set(ev, new Set()); this.h.get(ev).add(fn); return () => this.off(ev, fn); }
  off(ev, fn){ this.h.get(ev)?.delete(fn); }
  emit(ev, data){ this.h.get(ev)?.forEach(fn => fn(data)); }
}
const bus = new EventBus();

// ============================================================
// SECCIÓN 3: ESTADO
// Todo el estado mutable vive aquí. Los setters emiten 'change'.
// El estado está separado de la representación: dos layouts leen
// el mismo estado.
// ============================================================

const State = (() => {
  let _objetivo = 'pasajeros';
  let _alpha = 1.5;
  let _sinuosidad = 1.25;
  let _presupuestoTotal = 20000;
  let _layout = 'geo';
  let _propuestas = new Set();
  let _mostrarExistentes = true;
  let _mostrarCandidatas = true;
  let _nodoSel = null;
  let _candidatas = new Set();
  let _perturbacion = null; // { robustas:Set, fragiles:Set, porcentaje:number }
  let _drawerAbierto = false;

  const api = {
    get objetivo(){ return _objetivo; },
    get alpha(){ return _alpha; },
    get sinuosidad(){ return _sinuosidad; },
    get presupuestoTotal(){ return _presupuestoTotal; },
    get layout(){ return _layout; },
    get propuestas(){ return _propuestas; },
    get mostrarExistentes(){ return _mostrarExistentes; },
    get mostrarCandidatas(){ return _mostrarCandidatas; },
    get nodoSel(){ return _nodoSel; },
    get candidatas(){ return _candidatas; },
    get perturbacion(){ return _perturbacion; },
    get drawerAbierto(){ return _drawerAbierto; },

    setObjetivo(v){ _objetivo = v; api._recalcularCandidatas(); bus.emit('change'); },
    setAlpha(v){ _alpha = v; api._recalcularCandidatas(); bus.emit('change'); },
    setSinuosidad(v){ _sinuosidad = v; api._recalcularCandidatas(); bus.emit('change'); },
    setPresupuesto(v){ _presupuestoTotal = v; bus.emit('change'); },
    setLayout(v){ _layout = v; bus.emit('layout:change'); bus.emit('change'); },
    setMostrarExistentes(v){ _mostrarExistentes = !!v; bus.emit('change'); },
    setMostrarCandidatas(v){ _mostrarCandidatas = !!v; bus.emit('change'); },
    setNodoSel(id){ _nodoSel = id; _drawerAbierto = !!id; bus.emit('change'); },
    cerrarDrawer(){ _drawerAbierto = false; _nodoSel = null; bus.emit('change'); },

    togglePropuesta(i, j){
      const k = edgeKey(i, j);
      if (_propuestas.has(k)) _propuestas.delete(k); else _propuestas.add(k);
      bus.emit('change');
    },
    limpiar(){ _propuestas.clear(); bus.emit('change'); },
    construirOptimo(){
      const budget = Modelo.presupuestoDisponibleLineas();
      const prop = Modelo.construirOptimo(_objetivo, budget);
      _propuestas = new Set(prop.map(e => edgeKey(e.i, e.j)));
      bus.emit('change');
    },
    _recalcularCandidatas(){
      const top = Modelo.topCandidatas(_objetivo, 15);
      _candidatas = new Set(top.map(e => edgeKey(e.i, e.j)));
    },
    aplicarPerturbacion(res){
      _perturbacion = res;
      bus.emit('change');
    },
    limpiarPerturbacion(){
      _perturbacion = null;
      bus.emit('change');
    }
  };
  return api;
})();

function edgeKey(i, j){ return i < j ? i + '|' + j : j + '|' + i; }
function edgeParts(k){ return k.split('|'); }

// ============================================================
// SECCIÓN 4: MODELO
// Lógica de distancias, costes, demanda, sinergia, optimización
// y perturbación. Todo puro (no toca el DOM).
// ============================================================

const Modelo = (() => {
  // Haversine: distancia real en línea recta sobre la esfera.
  function haversine(a, b){
    const R = 6371, dLat = (b.lat - a.lat) * Math.PI/180, dLon = (b.lon - a.lon) * Math.PI/180;
    const la1 = a.lat * Math.PI/180, la2 = b.lat * Math.PI/180;
    const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // Distancia ferroviaria estimada = haversine * sinuosidad.
  // La sinuosidad aproxima el rodeo por relieve y trazado.
  function distancia(i, j){
    return Math.max(haversine(NODOS[i], NODOS[j]) * State.sinuosidad, 10);
  }
  function esIsla(i, j){
    return NODOS[i].tagsCtx.includes('isla') || NODOS[j].tagsCtx.includes('isla');
  }

  // CAPEX: 8 M€/km. Isla: ×8 (aproximación a ferry/submarino).
  function costeCAPEX(i, j){
    let f = 8; if (esIsla(i, j)) f *= 8;
    return distancia(i, j) * f;
  }
  // OPEX: 0,1 M€/km/año. Isla: ×3.
  function costeOPEX(i, j){
    let f = 0.1; if (esIsla(i, j)) f *= 3;
    return distancia(i, j) * f;
  }

  // Sinergia entre nodos: max entre sectores + bonus por tags.
  // El peso 0.7 en tags evita que un tag sustituya al tejido base.
  function sinergiaNodos(i, j){
    const ni = NODOS[i], nj = NODOS[j];
    let base = 0;
    for (const a of ni.sectores) for (const b of nj.sectores) {
      base = Math.max(base, SECT_MAT[a]?.[b] ?? 0.1);
    }
    let bonus = 0;
    for (const a of ni.tagsProd) for (const b of nj.tagsProd) {
      bonus = Math.max(bonus, (TAG_MAT[a]?.[b] ?? 0) * 0.7);
    }
    return Math.max(base, bonus);
  }

  // Modificadores contextuales por nodo.
  function modMercancias(id){
    return NODOS[id].tagsCtx.includes('puerto') ? 1.5 : 1;
  }
  function modPasajeros(id){
    let m = 1;
    if (NODOS[id].tagsCtx.includes('metropoli')) m *= 1.3;
    if (NODOS[id].tagsCtx.includes('vaciada')) m *= 0.8;
    return m;
  }
  function modEquidad(id){
    return NODOS[id].tagsCtx.includes('vaciada') ? 2 : 1;
  }

  // Demanda de pasajeros: gravitatorio clásico.
  function demandaPasajeros(i, j){
    const Pi = NODOS[i].poblacion, Pj = NODOS[j].poblacion;
    const base = 1e6 * (Pi * Pj) / Math.pow(distancia(i, j), State.alpha);
    return base * modPasajeros(i) * modPasajeros(j);
  }

  // Demanda de mercancías: sinergia * masa / sqrt(distancia).
  function demandaMercancia(i, j){
    const Pi = NODOS[i].poblacion, Pj = NODOS[j].poblacion;
    const base = 1e5 * sinergiaNodos(i, j) * Math.sqrt(Pi * Pj) / Math.sqrt(distancia(i, j));
    return base * modMercancias(i) * modMercancias(j);
  }

  // Score por arista según objetivo. Este es el punto donde
  // "lo que se optimiza" cambia el resultado.
  function scoreEdge(i, j, obj){
    const pas = demandaPasajeros(i, j);
    const mer = demandaMercancia(i, j);
    const cos = costeCAPEX(i, j);
    switch (obj) {
      case 'pasajeros':   return pas;
      case 'mercancia':   return mer;
      case 'mixta':       return pas * 0.5 + mer * 0.5;
      case 'eficiencia':  return (pas + mer * 0.5) / cos;
      case 'equidad':     return (modEquidad(i) / NODOS[i].poblacion + modEquidad(j) / NODOS[j].poblacion) / (distancia(i, j) + 100);
      default:            return pas;
    }
  }

  function allPairs(){
    const ids = Object.keys(NODOS), out = [];
    for (let i = 0; i < ids.length; i++)
      for (let j = i + 1; j < ids.length; j++)
        out.push({ i: ids[i], j: ids[j] });
    return out;
  }

  let _existCache = null;
  function existentesSet(){
    if (_existCache) return _existCache;
    _existCache = new Set();
    for (const [a, b] of EXISTENTES_RAW) _existCache.add(edgeKey(a, b));
    return _existCache;
  }

  // Top N candidatas (no existentes) por score del objetivo.
  function topCandidatas(obj, n){
    const exist = existentesSet();
    const cands = allPairs().filter(p => !exist.has(edgeKey(p.i, p.j)));
    const scored = cands.map(p => ({ ...p, score: scoreEdge(p.i, p.j, obj) }));
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, n);
  }

  // Greedy: ordena por score/coste y añade hasta agotar presupuesto.
  // No es óptimo global, pero es explicable y rápido.
  function construirOptimo(obj, presupuesto){
    const exist = existentesSet();
    const cands = allPairs().filter(p => !exist.has(edgeKey(p.i, p.j)));
    const scored = cands
      .map(p => ({ ...p, score: scoreEdge(p.i, p.j, obj), coste: costeCAPEX(p.i, p.j) }))
      .filter(e => e.coste > 0);
    scored.sort((a, b) => (b.score / b.coste) - (a.score / a.coste));
    const prop = []; let total = 0;
    for (const e of scored) {
      if (total + e.coste <= presupuesto) { prop.push(e); total += e.coste; }
    }
    return prop;
  }

  // Coste de inversiones en nodos (tags añadidos por el usuario).
  // Se calcula comparando el estado actual con el inicial.
  const COSTE_TAG_PROD = 2000;    // M€ por tag productivo
  const COSTE_TAG_CTX = 1500;     // M€ por tag contextual (excepto isla, fijo)
  function costeInversiones(){
    let total = 0;
    for (const id in NODOS) {
      const n = NODOS[id];
      const raw = NODOS_RAW.find(r => r[0] === id);
      if (!raw) continue;
      const tagsProdOrig = new Set(raw[5]);
      const tagsCtxOrig = new Set(raw[6]);
      for (const t of n.tagsProd) if (!tagsProdOrig.has(t)) total += COSTE_TAG_PROD;
      for (const t of n.tagsCtx) if (!tagsCtxOrig.has(t) && t !== 'isla') total += COSTE_TAG_CTX;
    }
    return total;
  }

  // Presupuesto disponible para líneas = total - inversiones en nodos.
  function presupuestoDisponibleLineas(){
    return Math.max(0, State.presupuestoTotal - costeInversiones());
  }

  function statsCostes(){
    const exist = existentesSet();
    let kmExist = 0, kmProp = 0, capexProp = 0;
    for (const k of exist) { const [a, b] = edgeParts(k); kmExist += distancia(a, b); }
    for (const k of State.propuestas) { const [a, b] = edgeParts(k); kmProp += distancia(a, b); capexProp += costeCAPEX(a, b); }
    const opex = (kmExist + kmProp) * 0.1;
    return { kmExist, kmProp, kmTotal: kmExist + kmProp, capexProp, opex,
             inversiones: costeInversiones(), disponible: presupuestoDisponibleLineas() };
  }

  function statsDemanda(){
    const exist = existentesSet();
    const todos = new Set([...exist, ...State.propuestas]);
    let pas = 0, mer = 0; const conectados = new Set();
    for (const k of todos) {
      const [a, b] = edgeParts(k);
      pas += demandaPasajeros(a, b); mer += demandaMercancia(a, b);
      conectados.add(a); conectados.add(b);
    }
    const conAlta = new Set();
    for (const [a, b, q] of EXISTENTES_RAW) if (q === 'alta') { conAlta.add(a); conAlta.add(b); }
    for (const k of State.propuestas) { const [a, b] = edgeParts(k); conAlta.add(a); conAlta.add(b); }
    const n = Object.keys(NODOS).length;
    return { pas, mer, conectados: conectados.size, n, aislados: n - conAlta.size };
  }

  // Perturbación: aplica ruido ±20% a SECT_MAT y TAG_MAT con semilla
  // fija (para reproducibilidad), recalcula top-15 candidatas y compara
  // con las originales. Devuelve robustas (en ambas), frágiles (solo en
  // una) y porcentaje de solapamiento.
  function perturbar(seed){
    const rng = mulberry32(seed);
    const origSect = JSON.parse(JSON.stringify(SECT_MAT));
    const origTag = JSON.parse(JSON.stringify(TAG_MAT));
    try {
      for (const a in SECT_MAT) for (const b in SECT_MAT[a]) {
        if (b < a) continue; // solo pares únicos
        const v = SECT_MAT[a][b] * (0.8 + 0.4 * rng());
        SECT_MAT[a][b] = v; SECT_MAT[b][a] = v;
      }
      for (const a in TAG_MAT) for (const b in TAG_MAT[a]) {
        if (b < a) continue;
        const v = TAG_MAT[a][b] * (0.8 + 0.4 * rng());
        TAG_MAT[a][b] = v; TAG_MAT[b][a] = v;
      }
      const origTop = new Set(topCandidatas(State.objetivo, 15).map(e => edgeKey(e.i, e.j)));
      const pertTop = new Set(topCandidatas(State.objetivo, 15).map(e => edgeKey(e.i, e.j)));
      const robustas = new Set(), fragiles = new Set();
      for (const k of origTop) { if (pertTop.has(k)) robustas.add(k); else fragiles.add(k); }
      for (const k of pertTop) { if (!origTop.has(k)) fragiles.add(k); }
      const porcentaje = Math.round(100 * robustas.size / origTop.size);
      return { robustas, fragiles, porcentaje };
    } finally {
      // Restaurar matriz original (la perturbación es solo para medir)
      for (const a in origSect) for (const b in origSect[a]) SECT_MAT[a][b] = origSect[a][b];
      for (const a in origTag) for (const b in origTag[a]) TAG_MAT[a][b] = origTag[a][b];
    }
  }

  return { distancia, costeCAPEX, costeOPEX, demandaPasajeros, demandaMercancia,
    sinergiaNodos, modMercancias, modPasajeros, modEquidad,
    scoreEdge, topCandidatas, construirOptimo, allPairs, existentesSet,
    statsCostes, statsDemanda, costeInversiones, presupuestoDisponibleLineas,
    perturbar, COSTE_TAG_PROD, COSTE_TAG_CTX };
})();

// PRNG reproducible (para perturbación).
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ============================================================
// SECCIÓN 5: RENDERER
// Dibuja nodos y aristas en el canvas. La vista (zoom + pan) se
// aplica como transformación sobre posiciones base (world coords).
// Esto permite pan/zoom fluido sin recalcular posiciones.
// ============================================================

function distToSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

class Renderer {
  constructor(canvas){
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.hoverEdge = null;
    this.hoverNode = null;
    this._lastMouse = null;
    this._worldPos = null;
    this._view = { centerX: 0, centerY: 0, zoom: 1, panX: 0, panY: 0 };
    this._dragging = false;
    this._dragStart = null;
    this._bind();
    window.addEventListener('resize', () => this.resize());
    bus.on('layout:change', () => this._computeWorldPositions(true));
    this.resize();
  }

  resize(){
    const dpr = window.devicePixelRatio || 1;
    const r = this.cv.getBoundingClientRect();
    this.cv.width = Math.floor(r.width * dpr);
    this.cv.height = Math.floor(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!this._worldPos) this._computeWorldPositions(true);
    bus.emit('change');
  }

  // Calcula posiciones base (world coords) para el layout activo.
  // En geo: lat/lon proyectadas (equirectangular simple).
  // En hex: retícula de fila/col.
  _computeWorldPositions(refit){
    const pos = {};
    if (State.layout === 'geo') {
      const cosLat = Math.cos(40 * Math.PI / 180);
      for (const id in NODOS) {
        const n = NODOS[id];
        pos[id] = { x: n.lon * cosLat, y: -n.lat };
      }
    } else {
      for (const id in NODOS) {
        const p = HEX_POS[id] || [0, 0];
        pos[id] = { x: p[1] * 42 + (p[0] % 2) * 21, y: p[0] * 38 };
      }
    }
    this._worldPos = pos;
    if (refit) this.fitToData();
  }

  // Ajusta la vista para que todos los nodos quepan con margen.
  fitToData(){
    const ps = Object.values(this._worldPos);
    if (!ps.length) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of ps) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    this._view.centerX = (minX + maxX) / 2;
    this._view.centerY = (minY + maxY) / 2;
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;
    this._view.zoom = Math.min(W / (spanX * 1.25), H / (spanY * 1.25));
    this._fitZoom = this._view.zoom;
    this._view.panX = 0; this._view.panY = 0;
    bus.emit('change');
  }

  worldToScreen(wx, wy){
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const v = this._view;
    return {
      x: (wx - v.centerX) * v.zoom + W/2 + v.panX,
      y: (wy - v.centerY) * v.zoom + H/2 + v.panY
    };
  }
  screenToWorld(sx, sy){
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const v = this._view;
    return {
      x: (sx - W/2 - v.panX) / v.zoom + v.centerX,
      y: (sy - H/2 - v.panY) / v.zoom + v.centerY
    };
  }
  _screenPos(id){
    const p = this._worldPos[id];
    return p ? this.worldToScreen(p.x, p.y) : null;
  }
  _nodeScreenPositions(){
    const out = {};
    for (const id in this._worldPos) out[id] = this._screenPos(id);
    return out;
  }

  zoomBy(factor, mx, my){
    const W = this.cv.clientWidth, H = this.cv.clientHeight;
    const before = this.screenToWorld(mx, my);
    this._view.zoom = Math.max(0.05, Math.min(200, this._view.zoom * factor));
    this._view.panX = mx - W/2 - (before.x - this._view.centerX) * this._view.zoom;
    this._view.panY = my - H/2 - (before.y - this._view.centerY) * this._view.zoom;
    bus.emit('change');
  }
  zoomCenter(factor){
    this.zoomBy(factor, this.cv.clientWidth/2, this.cv.clientHeight/2);
  }
  resetView(){ this.fitToData(); }

  _bind(){
    // Pan: mousedown + drag (si no es sobre un nodo)
    this.cv.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      this._dragStart = { x: e.offsetX, y: e.offsetY, panX: this._view.panX, panY: this._view.panY };
      this._dragging = false;
      this.cv.classList.add('dragging');
    });
    window.addEventListener('mousemove', e => {
      if (!this._dragStart) return;
      const r = this.cv.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const dx = mx - this._dragStart.x, dy = my - this._dragStart.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) this._dragging = true;
      if (this._dragging) {
        this._view.panX = this._dragStart.panX + dx;
        this._view.panY = this._dragStart.panY + dy;
        bus.emit('change');
      }
    });
    window.addEventListener('mouseup', () => {
      this._dragStart = null;
      this.cv.classList.remove('dragging');
    });

    // Wheel: zoom centrado en el cursor
    this.cv.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
      this.zoomBy(factor, e.offsetX, e.offsetY);
    }, { passive: false });

    // Hover: detecta nodo o arista bajo el cursor
    this.cv.addEventListener('mousemove', e => {
      if (this._dragStart) return;
      this._lastMouse = { x: e.offsetX, y: e.offsetY };
      this._updateHover(e.offsetX, e.offsetY);
    });
    this.cv.addEventListener('mouseleave', () => {
      this.hoverNode = null; this.hoverEdge = null; this._lastMouse = null;
      bus.emit('change');
    });

    // Click: selecciona nodo (abre drawer) o toggle arista
    this.cv.addEventListener('click', e => {
      if (this._dragging) return;
      const pos = this._nodeScreenPositions();
      let bn = null, bnD = 15;
      for (const id in pos) {
        const d = Math.hypot(pos[id].x - e.offsetX, pos[id].y - e.offsetY);
        if (d < bnD) { bnD = d; bn = id; }
      }
      if (bn) { State.setNodoSel(bn); return; }
      const all = new Set([...EXISTENTES_RAW.map(([a,b]) => edgeKey(a,b)), ...State.propuestas, ...State.candidatas]);
      let be = null, beD = 8;
      for (const k of all) {
        const [a, b] = edgeParts(k);
        if (!pos[a] || !pos[b]) continue;
        const d = distToSeg(e.offsetX, e.offsetY, pos[a].x, pos[a].y, pos[b].x, pos[b].y);
        if (d < beD) { beD = d; be = k; }
      }
      if (be) {
        const exist = Modelo.existentesSet();
        if (!exist.has(be)) { const [a, b] = edgeParts(be); State.togglePropuesta(a, b); }
      }
    });
  }

  _updateHover(mx, my){
    const pos = this._nodeScreenPositions();
    let bn = null, bnD = 15;
    for (const id in pos) {
      const d = Math.hypot(pos[id].x - mx, pos[id].y - my);
      if (d < bnD) { bnD = d; bn = id; }
    }
    let be = null, beD = 8;
    if (!bn) {
      const all = new Set([...EXISTENTES_RAW.map(([a,b]) => edgeKey(a,b)), ...State.propuestas, ...State.candidatas]);
      for (const k of all) {
        const [a, b] = edgeParts(k);
        if (!pos[a] || !pos[b]) continue;
        const d = distToSeg(mx, my, pos[a].x, pos[a].y, pos[b].x, pos[b].y);
        if (d < beD) { beD = d; be = k; }
      }
    }
    if (bn !== this.hoverNode || be !== this.hoverEdge) {
      this.hoverNode = bn; this.hoverEdge = be;
      bus.emit('change');
    }
  }

  draw(){
    const ctx = this.ctx, W = this.cv.clientWidth, H = this.cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0f1115'; ctx.fillRect(0, 0, W, H);
    if (!this._worldPos) this._computeWorldPositions(true);
    const pos = this._nodeScreenPositions();
    const existSet = Modelo.existentesSet();
    const pert = State.perturbacion;

    // Red existente
    if (State.mostrarExistentes) {
      for (const [a, b, q] of EXISTENTES_RAW) {
        if (!pos[a] || !pos[b]) continue;
        ctx.beginPath(); ctx.moveTo(pos[a].x, pos[a].y); ctx.lineTo(pos[b].x, pos[b].y);
        if (q === 'alta') { ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.5; ctx.setLineDash([]); }
        else { ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); }
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // Candidatas (amarillas punteadas). Si hay perturbación, se
    // distinguen robustas (gruesas) y frágiles (finas discontinuas).
    if (State.mostrarCandidatas) {
      for (const k of State.candidatas) {
        if (existSet.has(k) || State.propuestas.has(k)) continue;
        const [a, b] = edgeParts(k);
        if (!pos[a] || !pos[b]) continue;
        let color = 'rgba(245,158,11,0.4)', width = 1.2, dash = [2, 3];
        if (pert) {
          if (pert.robustas.has(k)) { color = 'rgba(245,158,11,0.9)'; width = 2.2; dash = []; }
          else if (pert.fragiles.has(k)) { color = 'rgba(239,68,68,0.5)'; width = 1.2; dash = [2, 3]; }
        }
        ctx.beginPath(); ctx.moveTo(pos[a].x, pos[a].y); ctx.lineTo(pos[b].x, pos[b].y);
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    // Propuestas (rojas)
    for (const k of State.propuestas) {
      const [a, b] = edgeParts(k);
      if (!pos[a] || !pos[b]) continue;
      ctx.beginPath(); ctx.moveTo(pos[a].x, pos[a].y); ctx.lineTo(pos[b].x, pos[b].y);
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.setLineDash([]); ctx.stroke();
    }

    // Hover edge
    if (this.hoverEdge) {
      const [a, b] = edgeParts(this.hoverEdge);
      if (pos[a] && pos[b]) {
        ctx.beginPath(); ctx.moveTo(pos[a].x, pos[a].y); ctx.lineTo(pos[b].x, pos[b].y);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.stroke();
      }
    }

    // Nodos
    for (const id in pos) {
      const p = pos[id], n = NODOS[id];
      const r = Math.max(4, Math.min(20, 3 + 4 * Math.sqrt(n.poblacion)));
      const sector = n.sectores[0];
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = SECTORES[sector]?.color || '#888'; ctx.fill();
      // Borde: blanco si seleccionado o hover
      ctx.strokeStyle = (id === State.nodoSel || id === this.hoverNode) ? '#fff' : 'rgba(0,0,0,0.5)';
      ctx.lineWidth = id === State.nodoSel ? 2.5 : (id === this.hoverNode ? 2 : 1);
      ctx.stroke();
      // Etiqueta: solo si es grande o está resaltado
      if (n.poblacion > 1.5 || id === State.nodoSel || id === this.hoverNode) {
        ctx.fillStyle = '#fff'; ctx.font = '10px ui-sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(id, p.x, p.y - r - 4);
      }
    }

    // Tooltip de hover
    if (this.hoverEdge && this._lastMouse) {
      const [a, b] = edgeParts(this.hoverEdge);
      const d = Modelo.distancia(a, b);
      const pas = Modelo.demandaPasajeros(a, b);
      const mer = Modelo.demandaMercancia(a, b);
      const cos = Modelo.costeCAPEX(a, b);
      const sin = Modelo.sinergiaNodos(a, b);
      const text = `${a} — ${b}\n${d.toFixed(0)} km · CAPEX ~${cos.toFixed(0)} M€\nPasajeros: ${pas.toFixed(0)} · Mercancías: ${mer.toFixed(0)}\nSinergia: ${sin.toFixed(2)}`;
      this._drawTooltip(text, this._lastMouse);
    }
  }

  _drawTooltip(text, m){
    const ctx = this.ctx, lines = text.split('\n');
    ctx.font = '11px ui-sans-serif';
    let w = 0; for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    const pad = 6, h = lines.length * 14 + pad * 2;
    let x = m.x + 12, y = m.y + 12;
    if (x + w + pad*2 > this.cv.clientWidth) x = m.x - w - pad*2 - 12;
    if (y + h > this.cv.clientHeight) y = m.y - h - 12;
    ctx.fillStyle = 'rgba(22,25,34,0.95)'; ctx.strokeStyle = '#2a2f3a';
    ctx.beginPath(); ctx.roundRect(x, y, w + pad*2, h, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e5e7eb'; ctx.textAlign = 'left';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], x + pad, y + pad + 11 + i*14);
  }
}

// ============================================================
// SECCIÓN 6: UI
// Panel principal + drawer de provincia. Los cambios en el drawer
// mutan NODOS directamente (es el estado) y emiten 'change'.
// ============================================================

const OBJETIVOS = [
  ['pasajeros', 'Demanda de pasajeros (gravedad)'],
  ['mercancia', 'Sinergia productiva (mercancías)'],
  ['mixta', 'Mixta (pasajeros + mercancías)'],
  ['eficiencia', 'Eficiencia (demanda / coste)'],
  ['equidad', 'Equidad (nodos pequeños primero)']
];

class UI {
  constructor(renderer){
    this.renderer = renderer;
    this._build();
    bus.on('change', () => this._render());
    bus.on('layout:change', () => this._render());
  }

  _build(){
    const sel = document.getElementById('sel-obj');
    for (const [k, v] of OBJETIVOS) {
      const o = document.createElement('option'); o.value = k; o.textContent = v; sel.appendChild(o);
    }
    sel.value = State.objetivo;
    sel.onchange = () => State.setObjetivo(sel.value);

    document.getElementById('rng-alpha').oninput = e => {
      document.getElementById('val-alpha').textContent = e.target.value;
      State.setAlpha(parseFloat(e.target.value));
    };
    document.getElementById('rng-sin').oninput = e => {
      document.getElementById('val-sin').textContent = e.target.value;
      State.setSinuosidad(parseFloat(e.target.value));
    };
    document.getElementById('rng-pres').oninput = e => {
      document.getElementById('val-pres').textContent = (+e.target.value).toLocaleString('es-ES') + ' M€';
      State.setPresupuesto(parseFloat(e.target.value));
    };
    document.getElementById('btn-build').onclick = () => { State.construirOptimo(); toast('Red óptima construida'); };
    document.getElementById('btn-clear').onclick = () => { State.limpiar(); toast('Propuestas eliminadas'); };

    document.getElementById('btn-perturbar').onclick = () => {
      const seed = Date.now() & 0xffff;
      const res = Modelo.perturbar(seed);
      State.aplicarPerturbacion(res);
      document.getElementById('perturbar-status').innerHTML =
        `Robustez: <strong style="color:var(--ok)">${res.porcentaje}%</strong> · ${res.robustas.size} robustas / ${res.fragiles.size} frágiles`;
      toast(`Perturbación aplicada (seed ${seed})`);
    };
    document.getElementById('btn-perturbar-reset').onclick = () => {
      State.limpiarPerturbacion();
      document.getElementById('perturbar-status').textContent = 'Sin perturbar';
      toast('Perturbación eliminada');
    };

    document.getElementById('btn-hex').onclick = () => State.setLayout('hex');
    document.getElementById('btn-geo').onclick = () => State.setLayout('geo');
    document.getElementById('cb-exist').onchange = e => State.setMostrarExistentes(e.target.checked);
    document.getElementById('cb-cand').onchange = e => State.setMostrarCandidatas(e.target.checked);

    document.getElementById('btn-zoom-in').onclick = () => this.renderer.zoomCenter(1.25);
    document.getElementById('btn-zoom-out').onclick = () => this.renderer.zoomCenter(1/1.25);
    document.getElementById('btn-zoom-reset').onclick = () => this.renderer.resetView();

    document.getElementById('btn-drawer-close').onclick = () => State.cerrarDrawer();
    document.getElementById('drawer-overlay').onclick = () => State.cerrarDrawer();

    State._recalcularCandidatas();
  }

  _render(){
    // Botones activos
    document.getElementById('btn-hex').classList.toggle('active', State.layout === 'hex');
    document.getElementById('btn-geo').classList.toggle('active', State.layout === 'geo');
    document.getElementById('cb-exist').checked = State.mostrarExistentes;
    document.getElementById('cb-cand').checked = State.mostrarCandidatas;

    // Zoom indicator
    const z = this.renderer._view.zoom;
    document.getElementById('zoom-indicator').textContent = Math.round(z * 100 / (this.renderer._view.zoom || 1) * 100) + '%';
    document.getElementById('zoom-indicator').textContent = Math.round(z * 100) + '%';

    // Stats costes
    const c = Modelo.statsCostes();
    document.getElementById('stats-costes').innerHTML = `
      <dt>km existentes</dt><dd>${c.kmExist.toFixed(0)}</dd>
      <dt>km propuestos</dt><dd>${c.kmProp.toFixed(0)}</dd>
      <dt>CAPEX líneas</dt><dd>${c.capexProp.toFixed(0)} M€</dd>
      <dt>Inversiones nodos</dt><dd>${c.inversiones.toFixed(0)} M€</dd>
      <dt>Disponible líneas</dt><dd>${c.disponible.toFixed(0)} M€</dd>
      <dt>OPEX anual</dt><dd>${c.opex.toFixed(1)} M€/año</dd>
      <dt>OPEX 10 años</dt><dd>${(c.opex*10).toFixed(0)} M€</dd>`;

    // Stats demanda
    const d = Modelo.statsDemanda();
    document.getElementById('stats-demanda').innerHTML = `
      <dt>Pasajeros (índice)</dt><dd>${d.pas.toFixed(0)}</dd>
      <dt>Mercancías (índice)</dt><dd>${d.mer.toFixed(0)}</dd>
      <dt>Nodos conectados</dt><dd>${d.conectados} / ${d.n}</dd>
      <dt>Sin alta calidad</dt><dd>${d.aislados}</dd>`;

    // Info nodo seleccionado (resumen corto)
    const el = document.getElementById('node-info');
    if (State.nodoSel) {
      const n = NODOS[State.nodoSel];
      const tagsHtml = [
        ...n.tagsProd.map(t => `<span class="tag" style="background:${TAGS_PRODUCTIVOS[t].color}">${TAGS_PRODUCTIVOS[t].label}</span>`),
        ...n.tagsCtx.map(t => `<span class="tag" style="background:${TAGS_CONTEXTUALES[t].color}">${TAGS_CONTEXTUALES[t].label}</span>`)
      ].join('');
      el.innerHTML = `<strong>${State.nodoSel}</strong> · ${(n.poblacion*1000).toFixed(0)}k hab<br>${tagsHtml}`;
    } else {
      el.innerHTML = '<span style="color:var(--muted)">Click en un nodo para configurarlo.</span>';
    }

    // Drawer
    this._renderDrawer();
    this.renderer.draw();
  }

  _renderDrawer(){
    const overlay = document.getElementById('drawer-overlay');
    const drawer = document.getElementById('drawer');
    const content = document.getElementById('drawer-content');
    if (!State.nodoSel || !State.drawerAbierto) {
      overlay.classList.remove('visible'); drawer.classList.remove('visible'); return;
    }
    overlay.classList.add('visible'); drawer.classList.add('visible');

    const id = State.nodoSel, n = NODOS[id];
    const raw = NODOS_RAW.find(r => r[0] === id);
    const costeInvNodo = (() => {
      let t = 0;
      const origProd = new Set(raw[5]), origCtx = new Set(raw[6]);
      for (const t2 of n.tagsProd) if (!origProd.has(t2)) t += Modelo.COSTE_TAG_PROD;
      for (const t2 of n.tagsCtx) if (!origCtx.has(t2) && t2 !== 'isla') t += Modelo.COSTE_TAG_CTX;
      return t;
    })();

    let html = `<h2>${id}</h2>
      <div class="node-summary">
        Población: ${(n.poblacion * 1000).toFixed(0)}k hab<br>
        Coord: ${n.lat.toFixed(2)}, ${n.lon.toFixed(2)}<br>
        ${n.tagsCtx.includes('isla') ? '<em style="color:var(--warn)">⚠ Isla (coste ×8)</em>' : ''}
      </div>`;

    // Sectores base (máx 2)
    html += `<h3>Sectores base (máx 2)</h3>`;
    for (const s in SECTORES) {
      const checked = n.sectores.includes(s);
      const disabled = !checked && n.sectores.length >= 2;
      html += `<div class="check-row">
        <label><input type="checkbox" data-tipo="sector" data-val="${s}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
        <span class="legend-dot" style="background:${SECTORES[s].color}"></span>${SECTORES[s].label}</label>
      </div>`;
    }

    // Tags productivos
    html += `<h3>Tags productivos</h3>`;
    for (const t in TAGS_PRODUCTIVOS) {
      const checked = n.tagsProd.includes(t);
      const esNuevo = checked && !raw[5].includes(t);
      html += `<div class="check-row">
        <label><input type="checkbox" data-tipo="prod" data-val="${t}" ${checked ? 'checked' : ''}>
        <span class="tag" style="background:${TAGS_PRODUCTIVOS[t].color}">${TAGS_PRODUCTIVOS[t].label}</span></label>
        ${esNuevo ? `<span class="coste">+${Modelo.COSTE_TAG_PROD} M€</span>` : ''}
      </div>`;
    }

    // Tags contextuales (isla fijo)
    html += `<h3>Tags contextuales</h3>`;
    for (const t in TAGS_CONTEXTUALES) {
      const info = TAGS_CONTEXTUALES[t];
      const checked = n.tagsCtx.includes(t);
      if (info.fijo) {
        html += `<div class="check-row">
          <label><input type="checkbox" ${checked ? 'checked' : ''} disabled>
          <span class="tag" style="background:${info.color}">${info.label}</span> (fijo)</label>
        </div>`;
      } else {
        const esNuevo = checked && !raw[6].includes(t);
        html += `<div class="check-row">
          <label><input type="checkbox" data-tipo="ctx" data-val="${t}" ${checked ? 'checked' : ''}>
          <span class="tag" style="background:${info.color}">${info.label}</span></label>
          ${esNuevo ? `<span class="coste">+${Modelo.COSTE_TAG_CTX} M€</span>` : ''}
        </div>`;
      }
    }

    // Coste acumulado
    if (costeInvNodo > 0) {
      html += `<div class="inv-list"><strong>Inversión en este nodo:</strong> ${costeInvNodo} M€</div>`;
    }

    // Conexiones existentes
    const exist = Modelo.existentesSet();
    const conexiones = [];
    for (const k of exist) {
      const [a, b] = edgeParts(k);
      if (a === id) conexiones.push({ otro: b, calidad: EXISTENTES_RAW.find(r => edgeKey(r[0], r[1]) === k)?.[2] || 'def' });
      else if (b === id) conexiones.push({ otro: a, calidad: EXISTENTES_RAW.find(r => edgeKey(r[0], r[1]) === k)?.[2] || 'def' });
    }
    if (conexiones.length) {
      html += `<h3>Conexiones existentes (${conexiones.length})</h3><div class="conn-list">`;
      for (const c of conexiones.sort((a, b) => a.calidad === 'alta' ? -1 : 1)) {
        html += `<div class="${c.calidad === 'alta' ? 'alta' : 'def'}">${c.otro} <span style="font-size:10px">(${c.calidad === 'alta' ? 'alta' : 'deficiente'})</span></div>`;
      }
      html += `</div>`;
    }

    // Botón reset nodo
    html += `<div style="margin-top:16px"><button class="danger" id="btn-reset-nodo" style="width:100%">Reset nodo a datos base</button></div>`;

    content.innerHTML = html;

    // Listeners
    content.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.onchange = () => {
        const tipo = cb.dataset.tipo, val = cb.dataset.val;
        if (tipo === 'sector') {
          if (cb.checked) {
            if (n.sectores.length < 2 && !n.sectores.includes(val)) n.sectores.push(val);
            else cb.checked = false;
          } else {
            n.sectores = n.sectores.filter(s => s !== val);
            if (n.sectores.length === 0) { n.sectores.push(val); cb.checked = true; }
          }
        } else if (tipo === 'prod') {
          if (cb.checked) { if (!n.tagsProd.includes(val)) n.tagsProd.push(val); }
          else n.tagsProd = n.tagsProd.filter(t => t !== val);
        } else if (tipo === 'ctx') {
          if (cb.checked) { if (!n.tagsCtx.includes(val)) n.tagsCtx.push(val); }
          else n.tagsCtx = n.tagsCtx.filter(t => t !== val);
        }
        State._recalcularCandidatas();
        bus.emit('change');
      };
    });
    document.getElementById('btn-reset-nodo').onclick = () => {
      n.sectores = [...raw[4]]; n.tagsProd = [...raw[5]]; n.tagsCtx = [...raw[6]];
      State._recalcularCandidatas();
      bus.emit('change');
    };
  }
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('visible');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('visible'), 1800);
}

// ============================================================
// SECCIÓN 7: TESTS
// Verifican lógica pura: distancias, sinergia, tags, costes,
// optimización, perturbación, matemáticas de pan/zoom.
// ============================================================

function runTests(){
  const res = [];
  const t = (n, c, x = '') => res.push({ n, ok: !!c, x });

  // Distancias
  const dMB = Modelo.distancia('Madrid', 'Barcelona');
  t('Distancia Madrid-BCN razonable (500-800 km)', dMB > 500 && dMB < 800, `=${dMB.toFixed(0)}`);

  // Demanda
  t('Madrid-BCN > Madrid-Soria (pasajeros)',
    Modelo.demandaPasajeros('Madrid', 'Barcelona') > Modelo.demandaPasajeros('Madrid', 'Soria'));

  // Sinergia
  t('Sinergia industria-logística alta', SECT_MAT.industria.logistica > 0.7);
  t('Sinergia turismo-turismo baja', SECT_MAT.turismo.turismo < 0.3);

  // Tags productivos
  t('Sinergia naval-automoción > 0.5', TAG_MAT.naval.automocion > 0.5);
  const sinFerrolVigo = Modelo.sinergiaNodos('Coruña', 'Pontevedra');
  t('Ferrol-Vigo con sinergia > 0.3', sinFerrolVigo > 0.3, `=${sinFerrolVigo.toFixed(2)}`);

  // Modificadores contextuales
  t('Puerto modifica mercancías', Modelo.modMercancias('Valencia') > 1);
  t('Metrópoli modifica pasajeros', Modelo.modPasajeros('Madrid') > 1);
  t('Vaciada modifica equidad', Modelo.modEquidad('Soria') > 1);

  // Costes
  t('CAPEX isla > CAPEX peninsular',
    Modelo.costeCAPEX('Baleares', 'Valencia') > Modelo.costeCAPEX('Valencia', 'Castellón'));

  // Optimización
  const top = Modelo.topCandidatas('pasajeros', 15);
  t('topCandidatas devuelve 15', top.length === 15);

  // Edge key
  t('edgeKey simétrico', edgeKey('A', 'B') === edgeKey('B', 'A'));
  t('Madrid-BCN existe', Modelo.existentesSet().has(edgeKey('Madrid', 'Barcelona')));

  // Sectores válidos
  let allValid = true;
  for (const id in NODOS) for (const s of NODOS[id].sectores) if (!SECTORES[s]) allValid = false;
  t('Todos los sectores válidos', allValid);

  // Perturbación
  const pert = Modelo.perturbar(42);
  t('Perturbación devuelve robustas+fragiles > 0', pert.robustas.size + pert.fragiles.size > 0);
  t('Perturbación porcentaje 0-100', pert.porcentaje >= 0 && pert.porcentaje <= 100);
  t('Matriz restaurada tras perturbar', SECT_MAT.industria.logistica > 0.7);

  // Pan/zoom
  const fake = { clientWidth: 800, clientHeight: 600 };
  const view = { centerX: 0, centerY: 0, zoom: 1, panX: 0, panY: 0 };
  const w2s = (wx, wy) => ({ x: (wx - view.centerX) * view.zoom + 400 + view.panX, y: (wy - view.centerY) * view.zoom + 300 + view.panY });
  const s2w = (sx, sy) => ({ x: (sx - 400 - view.panX) / view.zoom + view.centerX, y: (sy - 300 - view.panY) / view.zoom + view.centerY });
  const p1 = w2s(10, 20); const back = s2w(p1.x, p1.y);
  t('worldToScreen/screenToWorld inversos', Math.abs(back.x - 10) < 1e-9 && Math.abs(back.y - 20) < 1e-9);

  console.group('%cTests · simulador ferroviario v2', 'color:#22d3ee;font-weight:bold');
  let fails = 0;
  for (const r of res) {
    if (r.ok) console.log(`  ✅ ${r.n} ${r.x}`);
    else { console.error(`  ❌ ${r.n} ${r.x}`); fails++; }
  }
  console.log(`${res.length - fails}/${res.length} OK`);
  console.groupEnd();
}

// ============================================================
// SECCIÓN 8: INIT
// ============================================================

window.addEventListener('DOMContentLoaded', () => {
  const renderer = new Renderer(document.getElementById('cv'));
  new UI(renderer);
  runTests();
  bus.emit('change');
});
